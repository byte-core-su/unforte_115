    <script src="lesson-route.js" defer></script>

    <script src="block-program.js" defer></script>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.72.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #333333; }
        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-highlight { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .value-changed { animation: pulse-highlight 0.4s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="antialiased selection:bg-purple-100 selection:text-purple-900">

    <!-- Header -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <div class="mb-6">
                <a data-course-direction="outline" href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-purple-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> 
                    返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-purple-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight"><span data-scenario-text="name">星際陣列指揮官</span>：<br class="hidden md:block"><span data-scenario-text="tagline">用清單打造星際任務</span></h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                <span data-scenario-text="intro">在六個星際任務中練習</span> <span class="font-bold text-purple-700 bg-purple-50 px-2 py-1 rounded-lg border border-purple-200 mx-1 shadow-sm inline-block whitespace-nowrap">清單</span>，從管理裝備到做出對決遊戲。
            </p>
        </div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-purple-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-indigo-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <main id="app-container" class="max-w-5xl mx-auto px-6 lg:px-8 py-12 relative min-h-[50vh]"></main>

    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 text-center">
            <p data-scenario-text="footer" class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <script>
        const { active: activeScenario, escapeHtml: escapeDuelText } = window.CourseScenarios;
        const duelScenario = activeScenario.duel;
        // ==========================================
        // ⚡ 星際爭霸戰：雙陣列對決模擬器 (Plain JS)
        // ==========================================
        let simSquadWeapons = [];
        let simEnemyFleet = [];
        let simBattleLog = [];
        let simBattleIndex = 0;
        let isSimAnimating = false;
        
        // Modal 控制變數
        let prepPool = [];

        function renderBattleArena() {
            const squadEl = document.getElementById('arena-squad');
            const enemyEl = document.getElementById('arena-enemy');
            const logEl = document.getElementById('arena-log');

            if (squadEl) {
                squadEl.innerHTML = simSquadWeapons.map((item, idx) => {
                    const isFighting = idx === simBattleIndex && isSimAnimating;
                    const isFought = idx < simBattleIndex;
                    let cls = "bg-slate-800 text-slate-400 border-slate-700";
                    if(isFighting) cls = "bg-indigo-600 text-white border-indigo-400 ring-2 ring-indigo-300 scale-105 shadow-lg z-10";
                    else if(isFought) cls = "bg-indigo-900/50 text-indigo-300 border-indigo-800 opacity-60";
                    return `
                        <div class="px-2 py-1.5 border rounded-lg font-bold text-xs flex justify-between items-center transition-all ${cls} group">
                            <div class="flex items-center gap-1.5 overflow-hidden">
                                <span class="text-[9px] font-mono w-3 text-right opacity-50 shrink-0">${idx+1}</span>
                                <span class="truncate">${escapeDuelText(item.text)}</span>
                            </div>
                            <span class="bg-black/30 px-1.5 py-0.5 rounded text-[10px] font-mono group-hover:bg-black/40 shrink-0">戰力 ${item.power}</span>
                        </div>
                    `;
                }).join('');
                if(simSquadWeapons.length === 0) squadEl.innerHTML = '<div class="text-xs text-slate-500 w-full text-center py-2">尚未取得裝備</div>';
            }

            if (enemyEl) {
                enemyEl.innerHTML = simEnemyFleet.map((item, idx) => {
                    const isFighting = idx === simBattleIndex && isSimAnimating;
                    const isFought = idx < simBattleIndex;
                    let cls = "bg-slate-800 text-slate-400 border-slate-700";
                    if(isFighting) cls = "bg-purple-600 text-white border-purple-400 ring-2 ring-purple-300 scale-105 shadow-lg z-10";
                    else if(isFought) cls = "bg-purple-900/50 text-purple-300 border-purple-800 opacity-60";
                    return `
                        <div class="px-2 py-1.5 border rounded-lg font-bold text-xs flex justify-between items-center transition-all ${cls} group">
                            <div class="flex items-center gap-1.5 overflow-hidden">
                                <span class="text-[9px] font-mono w-3 text-right opacity-50 shrink-0">${idx+1}</span>
                                <span class="truncate">${escapeDuelText(item.text)}</span>
                            </div>
                            <span class="bg-black/30 px-1.5 py-0.5 rounded text-[10px] font-mono group-hover:bg-black/40 shrink-0">戰力 ${item.power}</span>
                        </div>
                    `;
                }).join('');
                if(simEnemyFleet.length === 0) enemyEl.innerHTML = '<div class="text-xs text-slate-500 w-full text-center py-2">尚未遭遇敵軍</div>';
            }

            if (logEl) {
                logEl.innerHTML = simBattleLog.map((result, idx) => {
                    if (result === '勝') return `<div class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded text-xs font-bold text-center animate-[popIn_0.2s_ease-out]">第 ${idx+1} 回合：🏆 勝</div>`;
                    if (result === '敗') return `<div class="bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2 py-1 rounded text-xs font-bold text-center animate-[popIn_0.2s_ease-out]">第 ${idx+1} 回合：💥 敗</div>`;
                    return `<div class="bg-slate-500/20 text-slate-400 border border-slate-500/30 px-2 py-1 rounded text-xs font-bold text-center animate-[popIn_0.2s_ease-out]">第 ${idx+1} 回合：平手</div>`;
                }).join('');
            }
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        // ================== Modal 分段邏輯 (嵌入模擬器內) ==================
        function openPrepModal() {
            if(isSimAnimating) return;
            const btn = document.getElementById('btn-sim-prep');
            if(btn) btn.disabled = true;

            const modal = document.getElementById('prep-modal-overlay');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 重置面板狀態
            document.getElementById('prep-modal-deck').innerHTML = '';
            document.getElementById('prep-squad-box').innerHTML = '';
            
            showPrepStep1();
        }

        function showPrepStep1() {
            document.getElementById('prep-modal-title').innerHTML = '1. 建立初始裝備庫存';
            document.getElementById('prep-modal-desc').innerHTML = '首先，我們依序建立 24 件裝備，每件裝備都會對應一個不同的戰鬥力數值！';
            
            const btn = document.getElementById('prep-modal-btn');
            btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i> 建立裝備清單';
            btn.className = "w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0";
            btn.onclick = prepGenerate;
            btn.disabled = false;
            lucide.createIcons();
        }

        async function prepGenerate() {
            const btn = document.getElementById('prep-modal-btn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 建立中...';
            btn.className = "w-full sm:w-auto bg-slate-700 text-slate-400 font-bold py-2.5 px-6 rounded-xl transition-all shadow-inner flex items-center justify-center gap-2 text-sm shrink-0 cursor-not-allowed";
            
            const types = duelScenario.types;
            // Match the costume numbers in both downloadable 積木程式 projects.
            const grades = ["A", "B", "C", "D", "E", "F"];
            prepPool = [];
            let p = 1;
            const deckEl = document.getElementById('prep-modal-deck');
            
            for (let i = 0; i < types.length; i++) {
                for (let j = 0; j < grades.length; j++) {
                    prepPool.push({ text: `${types[i]} ${grades[j]}`, power: p });
                    deckEl.innerHTML = prepPool.map((item, idx) => `
                        <div class="flex items-center justify-between bg-white border border-slate-300 shadow-sm rounded px-1.5 py-1 animate-[popIn_0.1s_ease-out] w-full">
                            <span class="text-[10px] font-bold text-slate-700 truncate flex-1">${escapeDuelText(item.text)}</span>
                            <span class="bg-slate-900 text-cyan-300 text-[10px] px-1 rounded font-mono font-bold shrink-0 ml-1">戰力 ${item.power}</span>
                        </div>
                    `).join('');
                    
                    p++;
                    deckEl.scrollTop = deckEl.scrollHeight;
                    await new Promise(r => setTimeout(r, 40));
                }
            }
            
            btn.innerHTML = '下一步：洗牌打散 <i data-lucide="arrow-right" class="w-4 h-4"></i>';
            btn.className = "w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0 animate-bounce";
            btn.onclick = showPrepStep2;
            btn.disabled = false;
            lucide.createIcons();
        }

        function showPrepStep2() {
            document.getElementById('prep-modal-title').innerHTML = '2. 亂數洗牌打散';
            document.getElementById('prep-modal-desc').innerHTML = '裝備庫依序排好了！接下來使用洗牌演算法將這 24 個裝備完全打散至「裝備分配」清單中。';
            
            const btn = document.getElementById('prep-modal-btn');
            btn.innerHTML = '<i data-lucide="shuffle" class="w-4 h-4"></i> 洗牌演算法';
            btn.className = "w-full sm:w-auto bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0";
            btn.onclick = prepShuffle;
            btn.disabled = false;
            lucide.createIcons();
        }

        async function prepShuffle() {
            const btn = document.getElementById('prep-modal-btn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 洗牌中...';
            btn.className = "w-full sm:w-auto bg-slate-700 text-slate-400 font-bold py-2.5 px-6 rounded-xl transition-all shadow-inner flex items-center justify-center gap-2 text-sm shrink-0 cursor-not-allowed";
            
            const deckEl = document.getElementById('prep-modal-deck');

            for(let k=0; k<8; k++) { 
                prepPool.sort(() => Math.random() - 0.5);
                deckEl.innerHTML = prepPool.map((item, idx) => `
                    <div class="flex items-center justify-between bg-amber-50 border border-amber-300 shadow-sm rounded px-1.5 py-1 animate-[popIn_0.1s_ease-out] w-full ring-1 ring-amber-300">
                        <span class="text-[10px] font-bold text-amber-700 truncate flex-1">${escapeDuelText(item.text)}</span>
                        <span class="bg-slate-900 text-amber-300 text-[10px] px-1 rounded font-mono font-bold shrink-0 ml-1">戰力 ${item.power}</span>
                    </div>
                `).join('');
                await new Promise(r => setTimeout(r, 450)); 
            }
            deckEl.innerHTML = prepPool.map((item, idx) => `
                <div class="flex items-center justify-between bg-white border border-slate-300 shadow-sm rounded px-1.5 py-1 w-full animate-[popIn_0.2s_ease-out]">
                    <span class="text-[10px] font-bold text-slate-700 truncate flex-1">${escapeDuelText(item.text)}</span>
                    <span class="bg-slate-900 text-cyan-300 text-[10px] px-1 rounded font-mono font-bold shrink-0 ml-1">戰力 ${item.power}</span>
                </div>
            `).join('');

            btn.innerHTML = '下一步：提取先遣隊裝備 <i data-lucide="arrow-right" class="w-4 h-4"></i>';
            btn.className = "w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0 animate-bounce";
            btn.onclick = showPrepStep3;
            btn.disabled = false;
            lucide.createIcons();
        }

        function showPrepStep3() {
            document.getElementById('prep-modal-title').innerHTML = '3. 提取先遣隊裝備';
            document.getElementById('prep-modal-desc').innerHTML = '重複 6 次，將洗好牌的「第 1 項」轉移到先遣隊的「小隊裝備」中！';
            
            const btn = document.getElementById('prep-modal-btn');
            btn.innerHTML = '<i data-lucide="users" class="w-4 h-4"></i> 取出前 6 項裝備';
            btn.className = "w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0";
            btn.onclick = prepExtract;
            btn.disabled = false;
            lucide.createIcons();
        }

        async function prepExtract() {
            const btn = document.getElementById('prep-modal-btn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 提取裝備中...';
            btn.className = "w-full sm:w-auto bg-slate-700 text-slate-400 font-bold py-2.5 px-6 rounded-xl transition-all shadow-inner flex items-center justify-center gap-2 text-sm shrink-0 cursor-not-allowed";
            
            simSquadWeapons = [];
            const deckEl = document.getElementById('prep-modal-deck');
            const squadEl = document.getElementById('prep-squad-box');
            
            for (let i = 0; i < 6; i++) {
                const extracted = prepPool.shift();
                simSquadWeapons.push(extracted);
                
                deckEl.innerHTML = prepPool.map((item, idx) => `
                    <div class="flex items-center justify-between bg-white border border-slate-300 shadow-sm rounded px-1.5 py-1 w-full">
                        <span class="text-[10px] font-bold text-slate-700 truncate flex-1">${escapeDuelText(item.text)}</span>
                        <span class="bg-slate-900 text-cyan-300 text-[10px] px-1 rounded font-mono font-bold shrink-0 ml-1">戰力 ${item.power}</span>
                    </div>
                `).join('');
                
                squadEl.innerHTML = simSquadWeapons.map((item, idx) => `
                    <div class="flex items-center justify-between bg-indigo-600 border border-indigo-400 shadow-sm rounded px-1.5 py-1 animate-[popIn_0.2s_ease-out] w-[48%] sm:w-[31%] shrink-0">
                        <span class="text-[10px] font-bold text-white truncate flex-1">${escapeDuelText(item.text)}</span>
                        <span class="bg-slate-900 text-cyan-300 text-[10px] px-1 rounded font-mono font-bold shrink-0 ml-1">${item.power}</span>
                    </div>
                `).join('');
                
                await new Promise(r => setTimeout(r, 250));
            }

            btn.innerHTML = '<i data-lucide="swords" class="w-4 h-4"></i> 完成！進入戰場';
            btn.className = "w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 text-sm shrink-0 animate-bounce";
            btn.onclick = prepFinish;
            btn.disabled = false;
            lucide.createIcons();
        }

        function prepFinish() {
            const modal = document.getElementById('prep-modal-overlay');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            simEnemyFleet = [];
            simBattleLog = [];
            simBattleIndex = 0;
            
            renderBattleArena();

            document.getElementById('arena-status').innerHTML = `<span class="text-emerald-400 font-bold">✅ 裝備提取完成！先遣小隊已就緒，請點擊「遭遇敵軍」。</span>`;
            document.getElementById('btn-sim-prep').classList.add('hidden');
            document.getElementById('btn-sim-enemy').classList.remove('hidden');
            
            isSimAnimating = false;
        }

        // ================== 主舞台邏輯 ==================
        async function doGenerateEnemies() {
            if(isSimAnimating) return;
            document.getElementById('btn-sim-enemy').classList.add('hidden');
            document.getElementById('arena-status').innerHTML = '<span class="text-purple-400 font-bold">偵測到敵方訊號！隨機產生 6 艘敵軍戰艦與戰鬥力...</span>';
            
            // 瀏覽器端從剩餘的洗牌清單中取出 6 個，確保不會有重複數字
            simEnemyFleet = [];
            for (let i = 0; i < 6; i++) {
                if (prepPool.length > 0) {
                    simEnemyFleet.push(prepPool.shift());
                } else {
                    let r = Math.floor(Math.random() * 24) + 1;
                    while (simEnemyFleet.find(item => item.power === r)) r = Math.floor(Math.random() * 24) + 1;
                    simEnemyFleet.push({ text: duelScenario.opponent, power: r });
                }
            }
            
            renderBattleArena();

            setTimeout(() => {
                document.getElementById('arena-status').innerHTML = '<span class="text-rose-400 font-bold">🚨 敵軍已進入射程範圍！請點擊「逐一對決」。</span>';
                document.getElementById('btn-sim-battle').classList.remove('hidden');
            }, 800);
        }

        async function doBattle() {
            if(isSimAnimating || simBattleIndex >= simSquadWeapons.length) return;
            isSimAnimating = true;
            document.getElementById('btn-sim-battle').classList.add('hidden');

            for (let i = 0; i < simSquadWeapons.length; i++) {
                simBattleIndex = i;
                renderBattleArena();
                
                let myPower = simSquadWeapons[i].power;
                let enPower = simEnemyFleet[i].power;
                
                document.getElementById('arena-status').innerHTML = `回合 ${i+1}：讀取清單第 ${i+1} 項比較 <span class="text-indigo-400 font-bold">我方(${myPower})</span> vs <span class="text-purple-400 font-bold">敵軍(${enPower})</span>`;
                await new Promise(r => setTimeout(r, 800));

                if (myPower > enPower) {
                    document.getElementById('arena-status').innerHTML = `👉 <span class="text-emerald-400 font-bold">我方戰力 (${myPower}) 大於敵方 (${enPower})，戰鬥勝利！</span>`;
                    simBattleLog.push('勝');
                } else if (myPower < enPower) {
                    document.getElementById('arena-status').innerHTML = `👉 <span class="text-purple-400 font-bold">我方戰力 (${myPower}) 不及敵方 (${enPower})，戰鬥失敗...</span>`;
                    simBattleLog.push('敗');
                } else {
                    document.getElementById('arena-status').innerHTML = `👉 <span class="text-amber-400 font-bold">雙方戰力 (${myPower}) 相等，平手！</span>`;
                    simBattleLog.push('平');
                }

                renderBattleArena();
                await new Promise(r => setTimeout(r, 1000));
            }
            
            simBattleIndex = 99; // 結束標記
            renderBattleArena();
            
            const wins = simBattleLog.filter(x => x === '勝').length;
            if(wins >= 3) {
                document.getElementById('arena-status').innerHTML = `🎉 戰鬥結算：共取得 <span class="text-emerald-400 font-bold">${wins} 勝</span>，成功擊退外星艦隊！`;
            } else {
                document.getElementById('arena-status').innerHTML = `⚠️ 戰鬥結算：僅取得 <span class="text-purple-400 font-bold">${wins} 勝</span>，必須撤退重新整備。`;
            }

            isSimAnimating = false;
        }

        function resetSim() {
            if (isSimAnimating) return;
            simSquadWeapons = [];
            simEnemyFleet = [];
            simBattleLog = [];
            simBattleIndex = 0;

            renderBattleArena();
            document.getElementById('arena-status').innerHTML = '按「整備清單」，開始建立裝備清單。';
            
            document.getElementById('btn-sim-prep').classList.remove('hidden');
            document.getElementById('btn-sim-prep').disabled = false;
            document.getElementById('btn-sim-enemy').classList.add('hidden');
            document.getElementById('btn-sim-battle').classList.add('hidden');
        }

        function renderSimulatorArea() {
            return `

                case 'list': return 'bg-[#FF661A] text-white border-[#CC5214]';
                case 'looks': return 'bg-[#9966FF] text-white border-[#774DCC]';
                case 'variable': return 'bg-[#FF8C1A] text-white border-[#DB6E00]';
                case 'control': return 'bg-[#FFAB19] text-white border-[#CF8B17]';
                case 'operator': return 'bg-[#59C059] text-white border-[#389438]';
                case 'sensing': return 'bg-[#5CB1D6] text-white border-[#478AA6]';
                default: return 'bg-slate-400 text-white border-slate-500';
            }
        }

        function renderScratchBlock(block, isFirst = false) {
            let nestedHtml = '';
            let bottomHtml = '';
            
            const notchTop = `<div class="absolute top-[-4px] left-4 w-8 h-2 bg-black/20 rounded-b-full"></div>`;
            const notchBottom = `<div class="absolute -bottom-1 left-4 w-8 h-2 bg-black/20 rounded-b-full z-30"></div>`;

            if (block.nested && block.nested.length > 0) {
                const nestedBlocks = block.nested.map((b, i) => renderScratchBlock(b, i === 0)).join('');
                nestedHtml += `<div class="ml-4 pl-3 border-l-[6px] border-[#CF8B17] py-0.5 bg-[#FFAB19]/10 relative z-10 flex flex-col w-max">${nestedBlocks}</div>`;
            }

            if (block.elseNested && block.elseNested.length > 0) {
                const elseBlocks = block.elseNested.map((b, i) => renderScratchBlock(b, i === 0)).join('');
                nestedHtml += `
                    <div class="px-4 py-1.5 border-b-4 border-r-2 shadow-md flex items-center gap-1 whitespace-nowrap bg-[#FFAB19] text-white border-[#CF8B17] relative z-20 w-max rounded-br-lg rounded-bl-sm mt-0">
                        ${notchTop}
                        否則
                        ${notchBottom}
                    </div>
                    <div class="ml-4 pl-3 border-l-[6px] border-[#CF8B17] py-0.5 bg-[#FFAB19]/10 relative z-10 flex flex-col w-max">${elseBlocks}</div>
                `;
            }

            if (block.nested && block.nested.length > 0) {
                bottomHtml = `<div class="h-8 w-32 rounded-b-xl border-b-4 border-r-2 shadow-sm ${getBlockColorClass(block.type)} relative z-20 flex items-center">${notchBottom}</div>`;
            }

            const isHat = block.isHat === true;
            const hatTop = isHat ? 'rounded-t-3xl pt-4' : 'rounded-t-lg';
            const showTopNotch = !isHat && !(block.elseNested && isFirst === false);

            return `
                <div class="flex flex-col items-start font-bold text-sm md:text-base w-max relative mb-[-4px] ${isFirst ? '' : 'mt-1'} group z-20">
                    <div class="px-4 py-2.5 ${hatTop} rounded-br-lg rounded-bl-sm border-b-4 border-r-2 shadow-md flex items-center gap-1 whitespace-nowrap ${getBlockColorClass(block.type)} relative z-20 hover:brightness-110 transition-all cursor-default w-max">
                        ${showTopNotch ? notchTop : ''}
                        ${block.text}
                        ${!block.nested ? notchBottom : ''}
                    </div>
                    ${nestedHtml}${bottomHtml}
                </div>`;
        }
