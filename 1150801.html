    <!-- 引入 React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.72.0"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #333333; }
        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 隱藏數字輸入框的上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 積木樣式 */
        .scratch-list-color { background-color: #ff661a; }
        .scratch-reporter { background-color: #ff661a; border-radius: 9999px; }
        .scratch-boolean { background-color: #ff661a; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); padding-left: 15px; padding-right: 15px;}
        
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="antialiased selection:bg-cyan-100 selection:text-cyan-900">

    <!-- Header (頁首顯示，維持版面整體感) -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <div class="mb-6">
                <a data-course-direction="outline" href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> 
                    返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-cyan-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight"><span data-scenario-text="name">星際陣列指揮官</span>：<br class="hidden md:block"><span data-scenario-text="tagline">用清單打造星際任務</span></h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                <span data-scenario-text="intro">在星艦裝備的任務中練習</span> <span class="font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded-lg border border-cyan-200 mx-1 shadow-sm inline-block whitespace-nowrap">清單</span>，從管理裝備到做出對決遊戲。
            </p>
        </div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-cyan-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <!-- React 應用程式掛載點 -->
    <main id="app-container" class="max-w-6xl mx-auto px-4 lg:px-8 py-12 relative min-h-[50vh]"></main>

    <details id="route-lesson-objectives" class="lesson-reference">
        <summary>清單和索引是什麼？</summary>
        <div class="bg-indigo-50 text-indigo-900 p-5 rounded-2xl border border-indigo-100/50 leading-relaxed font-medium">
            一個變數一次存一個值，清單可以依序存放多筆資料。每個項目的位置叫「索引」，例如清單最上面是第 1 項。
        </div>
    </details>

    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-6xl mx-auto px-6 lg:px-8 text-center">
            <p data-scenario-text="footer" class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <!-- React 互動程式邏輯 -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;
        const { active: scenario } = window.CourseScenarios;
        const { items: scenarioItems } = scenario.inventory;

        // ==========================================
        // 課程介紹標頭 (原網頁的保留資料)
        // ==========================================
        const LessonHeader = () => (
            <div data-course-direction="outline" className="slide-up-fade mb-10">
                <button data-course-direction="outline" onClick={() => window.location.href="1150800.html"} className="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors px-4 py-2 rounded-xl hover:bg-white border border-transparent hover:border-slate-200 hover:shadow-sm mb-6">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> 
                    返回任務儀表板
                </button>
            </div>
        );

        const demoList = [scenarioItems.supply.label, scenarioItems.priority.label, scenarioItems.repair.label];

        function applyListOperation(list, operation, position, item) {
            const next = [...list];
            const index = Number(position) - 1;
            switch (operation) {
                case 'add': next.push(item); break;
                case 'insert': next.splice(index, 0, item); break;
                case 'replace': next[index] = item; break;
                case 'delete': next.splice(index, 1); break;
            }
            return next;
        }

        function makeListChallenge(number = 0) {
            const supplies = [scenarioItems.supply, scenarioItems.tool, scenarioItems.repair, scenarioItems.ore];
            const variant = number % supplies.length;
            const [first, second, third, fourth] = supplies.map((_, index) => supplies[(variant + index) % supplies.length].label);
            const priority = scenarioItems.priority.label;
            const targets = [
                [second, priority, first],
                [priority, second, fourth, third],
                [second, fourth],
                [third, second, priority, fourth]
            ];
            return { number: variant, start: [first, priority, third], target: targets[variant] };
        }

        function compareLists(list, target) {
            if (list.length !== target.length) {
                return `項目數不同：目前有 ${list.length} 項，目標是 ${target.length} 項。`;
            }
            const firstDifference = target.findIndex((item, index) => list[index] !== item);
            return firstDifference === -1 ? '' : `第 ${firstDifference + 1} 項和目標不同。`;
        }

        function equipmentValue(value) {
            const text = value.trim();
            return Object.values(scenarioItems).find(item => item.name === text || item.label === text)?.label ?? text;
        }

        const demoFrames = [
            { insert: [0, 1, 2, null], add: [0, 1, 2, null], caption: '兩邊從相同的 3 項開始。準備放入一件新裝備。' },
            { insert: [0, 1, 3, null], add: [0, 1, 2, null], moving: 2, caption: '插入：原本的第 3 項先往下一格。' },
            { insert: [0, 2, 3, null], add: [0, 1, 2, null], moving: 1, caption: '插入：原本的第 2 項往下移，第 2 格空出來了。' },
            { insert: [0, 2, 3, 1], add: [0, 1, 2, null], caption: '新裝備放入第 2 格。插入後，共 4 項。' },
            { insert: [0, 2, 3, 1], add: [0, 1, 2, 3], caption: '添加：新裝備放到最後。也是 4 項，原有裝備的位置都一樣。' }
        ];

        function DemoList({ title, items, positions, deliverySlot, moving }) {
            const count = positions.filter(position => position !== null).length;
            const ordered = positions.flatMap((position, index) =>
                position === null ? [] : [{ position, item: items[index] }]
            ).sort((a, b) => a.position - b.position);
            return (
                <section className="list-demo__panel" aria-label={title}>
                    <header><h3>{title}</h3><span>{count} 項</span></header>
                    <ol className="sr-only" role="list">
                        {ordered.map(({ position, item }) => <li key={position}>第 {position + 1} 項：{item}</li>)}
                    </ol>
                    <div className="list-demo__slots" aria-hidden="true">
                        {[1, 2, 3, 4].map(slot => <div key={slot} className="list-demo__slot"><span>{slot}</span></div>)}
                        {items.map((item, index) => (
                            <div key={item} className="list-demo__tile" style={{ '--slot': positions[index] ?? deliverySlot }}
                                data-present={positions[index] !== null ? '' : undefined}
                                data-moving={index === moving ? '' : undefined}
                                data-new={index === items.length - 1 ? '' : undefined}>
                                {item}
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        function ListDemo({ onComplete }) {
            const [frame, setFrame] = useState(0);
            const [playing, setPlaying] = useState(false);
            const finalFrame = demoFrames.length - 1;
            const current = demoFrames[frame];
            const newItem = scenarioItems.signal.label;
            const items = [...demoList, newItem];

            useEffect(() => {
                if (frame === finalFrame) {
                    setPlaying(false);
                    onComplete(true);
                    return;
                }
                if (!playing) return;
                const timer = setTimeout(() => setFrame(frame + 1), 1500);
                return () => clearTimeout(timer);
            }, [frame, playing, onComplete, finalFrame]);

            function moveFrame(amount) {
                setPlaying(false);
                setFrame(Math.max(0, Math.min(finalFrame, frame + amount)));
            }

            function togglePlayback() {
                if (frame === finalFrame) setFrame(0);
                setPlaying(!playing);
            }

            return (
                <div className="list-demo" data-demo-frame={frame}>
                    <p className="list-demo__incoming">新裝備 <span>{newItem}</span></p>
                    <div className="list-demo__compare">
                        <DemoList title="插入第 2 項" items={items} positions={current.insert} deliverySlot={1} moving={current.moving} />
                        <DemoList title="添加到最後" items={items} positions={current.add} deliverySlot={3} />
                    </div>
                    <p className="list-demo__caption" role="status">{current.caption}</p>
                    <div className="list-demo__controls">
                        <button type="button" onClick={togglePlayback}>
                            {playing ? '暫停' : frame === finalFrame ? '重播示範' : frame === 0 ? '播放示範' : '繼續播放'}
                        </button>
                        <button type="button" disabled={frame === 0} onClick={() => moveFrame(-1)}>上一格</button>
                        <button type="button" disabled={frame === finalFrame} onClick={() => moveFrame(1)}>下一格</button>
                        <span>{frame + 1} / {demoFrames.length}</span>
                    </div>
                </div>
            );
        }

        function MissionList({ title, items }) {
            return (
                <div className="list-mission__items">
                    <strong>{title}（{items.length} 項）</strong>
                    <ol role="list">
                        {items.map((item, index) => <li key={index}><span>{index + 1}</span><span>{item}</span></li>)}
                    </ol>
                    {!items.length && <p>目前是空清單。</p>}
                </div>
            );
        }

        const ListMissions = ({ onChallenge }) => {
            const [stage, setStage] = useState(0);
            const [base, setBase] = useState(demoList);
            const [selectedItem, setSelectedItem] = useState('');
            const [selectedLength, setSelectedLength] = useState('');
            const [result, setResult] = useState(null);
            const [feedback, setFeedback] = useState('');
            const [passed, setPassed] = useState(false);
            const titleRef = useRef(null);
            const titles = ['示範：添加與插入', '第 1 題：預測刪除後的清單'];

            useEffect(() => {
                if (stage > 0) titleRef.current.focus();
            }, [stage]);

            function showResult(next, text) {
                setResult(next);
                setFeedback(text);
            }

            function nextQuestion() {
                setBase(makePracticeList());
                setStage(stage + 1);
                setResult(null);
                setFeedback('');
                setPassed(false);
            }

            function checkPrediction(event) {
                event.preventDefault();
                if (!selectedItem || !selectedLength) return;
                const next = applyListOperation(base, 'delete', 2);
                const correct = selectedItem === next[1] && Number(selectedLength) === next.length;
                showResult(next, correct
                    ? '預測正確。刪掉第 2 項後，原本的第 3 項往前補，清單少一項。'
                    : '對照操作前和操作後。注意哪一項往前補，以及清單少了幾項，再修改答案。');
                setPassed(correct);
            }

            return (
                <div className="bg-white rounded-3xl shadow-lg p-5 md:p-8 border-t-8 border-cyan-500 list-mission" data-list-stage={stage}>
                    <h2 ref={titleRef} tabIndex="-1" className="text-2xl font-black text-slate-800 mb-3">{titles[stage]}</h2>
                    {stage === 0 ? <ListDemo onComplete={setPassed} /> : (
                        <>
                            <p className="mb-3">刪除第 2 項後，新的第 2 項是什麼？清單剩幾項？</p>
                            <div className="list-demo__compare">
                                <MissionList title="操作前" items={base} />
                            </div>
                        </>
                    )}
                    {stage === 1 && (
                        <form onSubmit={checkPrediction}>
                            <fieldset disabled={passed}>
                                <label>新的第 2 項
                                    <select id="list-predict-item" required value={selectedItem} onChange={event => setSelectedItem(event.target.value)}>
                                        <option value="">請選一項</option>
                                        {base.map(item => <option key={item}>{item}</option>)}
                                    </select>
                                </label>
                                <label>剩餘項目數
                                    <select id="list-predict-length" required value={selectedLength} onChange={event => setSelectedLength(event.target.value)}>
                                        <option value="">請選數量</option>
                                        {[base.length - 1, base.length, base.length + 1].map(length => <option key={length}>{length}</option>)}
                                    </select>
                                </label>
                                <button type="submit">核對預測</button>
                            </fieldset>
                        </form>
                    )}
                    {stage > 0 && <div role="status" className="mt-3 space-y-2">
                        {result && <MissionList title="操作後" items={result} />}
                        {feedback && <p>{feedback}</p>}
                    </div>}
                    {passed && <button type="button" onClick={stage === 0 ? nextQuestion : onChallenge}>{stage === 0 ? '開始第 1 題' : '開始第 2 題：做出目標清單'}</button>}
                </div>
            );
        };

        function ListGoalPanel({ list, target, difference, message, onReset, onNewCase }) {
            const heading = useRef(null);
            useEffect(() => heading.current.focus(), []);

            return (
                <aside className="list-goal" aria-labelledby="list-goal-title">
                    <h2 id="list-goal-title" ref={heading} tabIndex="-1">第 2 題：做出目標清單</h2>
                    <p>用情境按鈕或積木整理裝備，讓每一項和目標清單相同。</p>
                    <div className="list-demo__compare">
                        <MissionList title="目前清單" items={list} />
                        <MissionList title="目標清單" items={target} />
                    </div>
                    <p className="list-goal__feedback" data-match={difference ? undefined : ''} role="status">
                        {difference || '達成目標！項目、順序和數量都一致，可以完成這一步。'}
                    </p>
                    <p role="status">{message}</p>
                    <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={onReset}>重做這題</button>
                        <button type="button" onClick={onNewCase}>換一題</button>
                    </div>
                </aside>
            );
        }

        function BlockInput({ value, onChange, label }) {
            return (
                <input type="text" value={value} onChange={event => onChange(event.target.value)} list="list-equipment-options"
                    aria-label={label} className="text-slate-900 text-center px-1 rounded-full bg-white shadow-inner mx-1 w-28" />
            );
        }

        function BlockNumInput({ value, onChange, label }) {
            return (
                <input type="number" min="1" value={value} onChange={event => onChange(event.target.value)}
                    aria-label={label} className="text-slate-900 text-center px-1 rounded-full bg-white shadow-inner mx-1 w-12" />
            );
        }

        function PlayBtn({ onClick, label, action }) {
            return (
                <button type="button" onClick={onClick} aria-label={label} data-list-action={action}
                    className="bg-black/40 hover:bg-black/60 rounded-full w-9 h-9 flex items-center justify-center mr-2 cursor-pointer shrink-0">
                    <span aria-hidden="true">▶</span>
                </button>
            );
        }

        const SandboxMode = ({ list, setList, setMessage }) => {
            const [useItemIndex, setUseItemIndex] = useState('1');
            const [removeItemIndex, setRemoveItemIndex] = useState('1');
            const [scenarioInsertIndex, setScenarioInsertIndex] = useState('1');
            const [scenarioReplaceIndex, setScenarioReplaceIndex] = useState('1');
            const [addValue, setAddValue] = useState(scenarioItems.repair.label);
            const [deleteIndex, setDeleteIndex] = useState('1');
            const [insertValue, setInsertValue] = useState(scenarioItems.tool.label);
            const [insertIndex, setInsertIndex] = useState('2');
            const [replaceIndex, setReplaceIndex] = useState('1');
            const [replaceValue, setReplaceValue] = useState(scenarioItems.core.label);
            const [getItemIndex, setGetItemIndex] = useState('1');
            const [containsValue, setContainsValue] = useState(scenarioItems.ore.label);

            // --- 情境區專用功能 ---
            const collectItem = (itemName) => {
                setList(applyListOperation(list, 'add', null, itemName));
                setMessage(`⚔️ 指揮官收集了「${itemName}」！這在程式裡等於使用了【添加 (${itemName}) 到清單】積木喔。`);
            };

            const handleScenarioInsert = () => {
                const idx = Number(scenarioInsertIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length + 1) {
                    setMessage(`要插入的位置必須是第 1 到第 ${list.length + 1} 項。`);
                    return;
                }
                setList(applyListOperation(list, 'insert', idx, scenarioItems.priority.label));
                setMessage(`🛡️ 系統將「${scenarioItems.priority.label}」緊急排入第 ${idx} 項！這在程式裡等於使用了【插入】積木。`);
            };

            const handleScenarioReplace = () => {
                const idx = Number(scenarioReplaceIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) {
                    setMessage(`⚠️ 找不到第 ${idx} 項裝備，升級失敗！`);
                    return;
                }
                const oldItem = list[idx - 1];
                setList(applyListOperation(list, 'replace', idx, scenarioItems.upgrade.label));
                setMessage(`✨ 系統把第 ${idx} 項的「${oldItem}」升級成「${scenarioItems.upgrade.label}」了！這等於使用了【替換】積木。`);
            };

            const useFirstItem = () => {
                if (list.length === 0) {
                    setMessage("⚠️ 裝備庫是空的！沒有資源可以使用。");
                    return;
                }
                const item = list[0];
                setList(applyListOperation(list, 'delete', 1));
                setMessage(`✨ 指揮官消耗了「${item}」！這等於使用了【刪除清單的第 (1) 項】積木。後方的物資自動往前遞補了！`);
            };

            const handleUseNthItem = () => {
                const idx = Number(useItemIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) {
                    setMessage(`⚠️ 裝備庫裡沒有第 ${idx} 項裝備喔！請確認輸入的編號。`);
                    return;
                }
                const item = list[idx - 1];
                setList(applyListOperation(list, 'delete', idx));
                setMessage(`✨ 指揮官使用了第 ${idx} 項的「${item}」！這相當於先用【第 (${idx}) 項】讀取它，再用【刪除第 (${idx}) 項】移除它。`);
            };

            const handleRemoveNthItem = () => {
                const idx = Number(removeItemIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) {
                    setMessage(`⚠️ 找不到第 ${idx} 項裝備，無法移除！`);
                    return;
                }
                const item = list[idx - 1];
                setList(applyListOperation(list, 'delete', idx));
                setMessage(`🗑️ 指揮官把第 ${idx} 項的「${item}」拋棄了！等於直接使用了【刪除清單的第 (${idx}) 項】積木。`);
            };

            // --- 積木區專用功能 ---
            const handleAdd = () => {
                const itemName = equipmentValue(addValue);
                if (!itemName) { setMessage("請輸入要加入的物資！"); return; }
                setList(applyListOperation(list, 'add', null, itemName));
                setMessage(`👉 已將「${itemName}」存入清單的最後面！目前長度變為 ${list.length + 1}。`);
            };
            const handleDelete = () => {
                const idx = Number(deleteIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) { setMessage("❌ 找不到這個編號！請輸入正確的項目編號。"); return; }
                const deletedItem = list[idx - 1];
                setList(applyListOperation(list, 'delete', idx));
                setMessage(`🗑️ 已刪除第 ${idx} 項的「${deletedItem}」。後面的項目會自動往前遞補喔！`);
            };
            const handleDeleteAll = () => {
                setList([]);
                setMessage("🌪️ 已經清空整個星艦裝備庫了！現在清單長度是 0。");
            };
            const handleInsert = () => {
                const itemName = equipmentValue(insertValue);
                const idx = Number(insertIndex);
                if (!itemName) { setMessage("請輸入要插入的物資！"); return; }
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length + 1) { setMessage(`❌ 無法插入！編號只能是 1 到 ${list.length + 1} 之間。`); return; }
                setList(applyListOperation(list, 'insert', idx, itemName));
                setMessage(`➡️ 已將「${itemName}」配置進第 ${idx} 個位置。原本在它後面的項目都往後退一格了！`);
            };
            const handleReplace = () => {
                const itemName = equipmentValue(replaceValue);
                const idx = Number(replaceIndex);
                if (!itemName) { setMessage("請輸入要替換成什麼物資！"); return; }
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) { setMessage("❌ 找不到這個編號，無法替換！"); return; }
                const oldItem = list[idx - 1];
                setList(applyListOperation(list, 'replace', idx, itemName));
                setMessage(`🔄 已將第 ${idx} 項原本的「${oldItem}」直接覆蓋替換成「${itemName}」！`);
            };
            const handleGetItem = () => {
                const idx = Number(getItemIndex);
                if (!Number.isInteger(idx) || idx < 1 || idx > list.length) { setMessage("❌ 找不到這個編號！"); return; }
                setMessage(`🔍 第 ${idx} 項裡裝的物資是：「${list[idx - 1]}」`);
            };
            const handleLength = () => {
                setMessage(`📏 目前裝備庫的總長度（共有幾個項目）是：${list.length}`);
            };
            const handleContains = () => {
                const itemName = equipmentValue(containsValue);
                if (!itemName) { setMessage("請輸入要檢查的物資！"); return; }
                const isContain = list.includes(itemName);
                setMessage(isContain ? `✅ 掃描完成！裝備庫裡面包含「${itemName}」。` : `❌ 掃描完成！裝備庫裡面不包含「${itemName}」。`);
            };

            return (
                <div className="animate-[fadeIn_0.5s_ease-out]">
                    <datalist id="list-equipment-options">
                        {Object.values(scenarioItems).map(item => <option key={item.name} value={item.name} />)}
                    </datalist>
                    {/* 區塊 1：真實場景應用 */}
                    <div className="bg-white rounded-2xl shadow-md p-6 mb-8 border-t-8 border-indigo-500">
                        <h2 className="text-2xl font-bold text-slate-800 mb-3 flex items-center gap-2">
                            用清單管理星艦裝備
                        </h2>
                        <p className="text-slate-600 mb-4 bg-indigo-50 p-3 rounded-lg border border-indigo-100 text-sm leading-relaxed">
                            用收集、插入、升級或移除調整目前清單。
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <h3 className="text-sm font-bold text-slate-500 mb-2">1. 探索並收集物資 (添加項目)</h3>
                                <div className="flex flex-wrap gap-2">
                                    <button type="button" data-list-action="scenario-add-supply" onClick={() => collectItem(scenarioItems.supply.label)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-xl font-bold shadow-sm transition-transform active:scale-95 flex items-center gap-1">{scenarioItems.supply.collect}</button>
                                    <button type="button" data-list-action="scenario-add-tool" onClick={() => collectItem(scenarioItems.tool.label)} className="bg-slate-50 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-xl font-bold shadow-sm transition-transform active:scale-95 flex items-center gap-1">{scenarioItems.tool.collect}</button>
                                    <button onClick={() => collectItem(scenarioItems.repair.label)} className="bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 px-4 py-2 rounded-xl font-bold shadow-sm transition-transform active:scale-95 flex items-center gap-1">{scenarioItems.repair.collect}</button>
                                    <button onClick={() => collectItem(scenarioItems.ore.label)} className="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-4 py-2 rounded-xl font-bold shadow-sm transition-transform active:scale-95 flex items-center gap-1">{scenarioItems.ore.collect}</button>
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-100">
                                <h3 className="text-sm font-bold text-slate-500 mb-2">2. 緊急防禦 (插入項目)</h3>
                                <div className="bg-cyan-50 border border-cyan-200 rounded-xl flex flex-wrap items-center shadow-sm p-1 pr-3 max-w-full">
                                    <button type="button" data-list-action="scenario-insert" onClick={handleScenarioInsert} className="hover:bg-cyan-100 text-cyan-700 px-3 py-1.5 rounded-lg font-bold transition-transform active:scale-95 flex items-center gap-1">
                                        🛡️ 插入 {scenarioItems.priority.search ?? scenarioItems.priority.name} 到第
                                    </button>
                                    <input type="number" min="1" aria-label="緊急防禦插入位置" value={scenarioInsertIndex} onChange={(e) => setScenarioInsertIndex(e.target.value)} className="w-12 text-center border border-cyan-300 rounded mx-1 py-1 outline-none font-bold bg-white" />
                                    <span className="text-cyan-700 font-bold">項</span>
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-100">
                                <h3 className="text-sm font-bold text-slate-500 mb-2">3. 裝備升級 (替換項目)</h3>
                                <div className="bg-indigo-50 border border-indigo-200 rounded-xl flex flex-wrap items-center shadow-sm p-1 pr-3 max-w-full">
                                    <button onClick={handleScenarioReplace} className="hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg font-bold transition-transform active:scale-95 flex items-center gap-1">
                                        ✨ 將第
                                    </button>
                                    <input type="number" min="1" aria-label="要升級的項次" value={scenarioReplaceIndex} onChange={(e) => setScenarioReplaceIndex(e.target.value)} className="w-12 text-center border border-indigo-300 rounded mx-1 py-1 outline-none font-bold bg-white" />
                                    <span className="text-indigo-700 font-bold">項升級為 {scenarioItems.upgrade.name}</span>
                                </div>
                            </div>
                            
                            <div className="pt-2 border-t border-slate-100">
                                <h3 className="text-sm font-bold text-slate-500 mb-2">4. 使用或管理物資 (讀取與刪除)</h3>
                                <div className="flex flex-col gap-3">
                                    <div>
                                        <button type="button" data-list-action="scenario-delete-first" onClick={useFirstItem} className="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-4 py-2 rounded-xl font-bold shadow-sm transition-transform active:scale-95 flex items-center gap-1">
                                            ✨ 消耗最優先順位物資 (第 1 項)
                                        </button>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <div className="bg-blue-50 border border-blue-200 rounded-xl flex flex-wrap items-center shadow-sm p-1 pr-3 max-w-full">
                                            <button onClick={handleUseNthItem} className="hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg font-bold transition-transform active:scale-95 flex items-center gap-1">
                                                ✨ 消耗第
                                            </button>
                                            <input type="number" min="1" aria-label="要消耗的項次" value={useItemIndex} onChange={(e) => setUseItemIndex(e.target.value)} className="w-12 text-center border border-blue-300 rounded mx-1 py-1 outline-none font-bold bg-white" />
                                            <span className="text-blue-700 font-bold">項裝備</span>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl flex flex-wrap items-center shadow-sm p-1 pr-3 max-w-full">
                                            <button onClick={handleRemoveNthItem} className="hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition-transform active:scale-95 flex items-center gap-1">
                                                🗑️ 移除第
                                            </button>
                                            <input type="number" min="1" aria-label="要移除的項次" value={removeItemIndex} onChange={(e) => setRemoveItemIndex(e.target.value)} className="w-12 text-center border border-slate-300 rounded mx-1 py-1 outline-none font-bold bg-white" />
                                            <span className="text-slate-700 font-bold">項裝備</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <a className="list-goal-link" href="#list-goal-title">查看目前與目標清單</a>
                    </div>

                    {/* 區塊 2：積木對應區 */}
                    <div className="bg-white rounded-2xl shadow-md p-6 border-t-8 border-[#ff661a]">
                        <h2 className="text-2xl font-bold text-slate-800 mb-3 flex items-center gap-2">
                            用積木操作清單
                        </h2>
                        <p className="text-slate-600 mb-6 bg-orange-50 p-3 rounded-lg border border-orange-100 text-sm leading-relaxed">
                            填好裝備或位置，再按積木左側的「▶」執行。
                        </p>

                        <div className="space-y-4 overflow-x-auto pb-4">
                            <div className="scratch-list-color text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#cc5214] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleAdd} label="執行添加" action="add" /><span className="font-bold text-lg tracking-wide whitespace-nowrap">添加 <BlockInput value={addValue} onChange={setAddValue} label="要添加的裝備" /> 到 [星艦裝備庫]</span>
                            </div>
                            <div className="scratch-list-color text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#cc5214] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleDelete} label="執行刪除" action="delete" /><span className="font-bold text-lg tracking-wide whitespace-nowrap">刪除 [星艦裝備庫] 的第 <BlockNumInput value={deleteIndex} onChange={setDeleteIndex} label="要刪除的項次" /> 項</span>
                            </div>
                            <div className="scratch-list-color text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#cc5214] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleDeleteAll} label="執行清空清單" action="clear" /><span className="font-bold text-lg tracking-wide whitespace-nowrap">刪除 [星艦裝備庫] 的所有項目</span>
                            </div>
                            <hr className="my-4 border-slate-200" />
                            <div className="scratch-list-color text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#cc5214] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleInsert} label="執行插入" action="insert" /><span className="font-bold text-lg tracking-wide whitespace-nowrap">插入 <BlockInput value={insertValue} onChange={setInsertValue} label="要插入的裝備" /> 到 [星艦裝備庫] 的第 <BlockNumInput value={insertIndex} onChange={setInsertIndex} label="要插入的項次" /> 項</span>
                            </div>
                            <div className="scratch-list-color text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#cc5214] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleReplace} label="執行替換" action="replace" /><span className="font-bold text-lg tracking-wide whitespace-nowrap">將 [星艦裝備庫] 的第 <BlockNumInput value={replaceIndex} onChange={setReplaceIndex} label="要替換的項次" /> 項替換為 <BlockInput value={replaceValue} onChange={setReplaceValue} label="要替換的裝備" /></span>
                            </div>
                            <hr className="my-4 border-slate-200" />
                            <div className="bg-[#9966ff] text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#7a52cc] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleGetItem} label="讀取裝備" action="read" /><span className="font-bold text-lg tracking-wide whitespace-nowrap flex items-center">說出<span className="scratch-reporter px-3 py-1 mx-2 flex items-center border border-[#cc5214]">[星艦裝備庫] 的第 <BlockNumInput value={getItemIndex} onChange={setGetItemIndex} label="要讀取的項次" /> 項</span></span>
                            </div>
                            <div className="bg-[#9966ff] text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#7a52cc] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleLength} label="讀取清單長度" action="length" /><span className="font-bold text-lg tracking-wide whitespace-nowrap flex items-center">說出<span className="scratch-reporter px-3 py-1 mx-2 flex items-center border border-[#cc5214]">[星艦裝備庫] 的長度</span></span>
                            </div>
                            <div className="bg-[#9966ff] text-white p-2 rounded-lg flex items-center shadow-md select-none w-max border-b-4 border-[#7a52cc] active:border-b-0 active:translate-y-1 transition-all">
                                <PlayBtn onClick={handleContains} label="檢查是否包含裝備" action="contains" /><span className="font-bold text-lg tracking-wide whitespace-nowrap flex items-center">說出<span className="scratch-boolean py-1 mx-2 flex items-center border border-[#cc5214]">[星艦裝備庫] 包含 <BlockInput value={containsValue} onChange={setContainsValue} label="要查詢的裝備" /> ？</span></span>
                            </div>
                        </div>
                        <a className="list-goal-link" href="#list-goal-title">查看目前與目標清單</a>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 主程式 (控制階段切換與版面)
        // ==========================================
        const practiceItemPool = [scenarioItems.supply.label, scenarioItems.tool.label, scenarioItems.repair.label, scenarioItems.ore.label, scenarioItems.priority.label, scenarioItems.signal.label, scenarioItems.engine.label];
        let previousPracticeList = '';
        function makePracticeList() {
            let result;
            let attempts = 0;
            do {
                result = [...practiceItemPool];
                for (let i = result.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [result[i], result[j]] = [result[j], result[i]];
                }
                result = result.slice(0, 3 + Math.floor(Math.random() * 3));
            } while (result.join(',') === previousPracticeList && ++attempts < 12);
            if (result.join(',') === previousPracticeList) result.reverse();
            previousPracticeList = result.join(',');
            return result;
        }

        function App() {
            const [challenge, setChallenge] = useState(null);
            const [list, setList] = useState([]);
            const [message, setMessage] = useState('');
            const difference = challenge ? compareLists(list, challenge.target) : '';
            const missionComplete = challenge && !difference;

            function openChallenge(number) {
                const next = makeListChallenge(number);
                setChallenge(next);
                setList(next.start);
                setMessage('');
            }

            return (
                <div>
                    {/* 課程介紹區域 */}
                    <LessonHeader />

                    <div id="route-list-missions" data-lesson-activity={missionComplete ? '' : undefined}
                        className={challenge ? 'list-challenge' : 'pb-6'}>
                        {challenge ? (
                            <>
                                <ListGoalPanel list={list} target={challenge.target} difference={difference} message={message}
                                    onReset={() => openChallenge(challenge.number)}
                                    onNewCase={() => openChallenge(challenge.number + 1)} />
                                <SandboxMode list={list} setList={setList} setMessage={setMessage} />
                            </>
                        ) : <ListMissions onChallenge={() => openChallenge(0)} />}
                    </div>

                    {/* 單元導覽按鈕 (全域顯示在頁面最下方) */}
                    <div className="mt-12 pt-8 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 pb-8">
                        <a data-course-direction="outline" href="1150800.html" className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 hover:text-cyan-600 transition-colors shadow-sm">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            上一單元 (任務首頁)
                        </a>
                        <a data-course-direction="next" href="1150802.html" className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700 transition-colors shadow-sm">
                            下一單元
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app-container'));
        root.render(<App />);
    </script>
</body>
</html>
