<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="已有 Scratch 基礎的國中生適用：10 個 Python 引導式單元，直接在網站撰寫、執行與驗證程式。">
  <title>Python Lab｜Python 互動學習</title>
  <link rel="stylesheet" href="pythonlab.css">
  <script type="module" src="app.js"></script>
</head>
<body class="python-lab">
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">Py</span><span>Python <b>Lab</b><small>從積木，走向程式碼</small></span></a>
    <nav aria-label="主要導覽"><a href="#">課程總覽</a><button type="button" data-dictionary>參考小幫手</button></nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML = '<p class="notice">請從教材網站網址開啟 Python 課程。本機預覽可在專案執行 npm run preview，再開啟 http://127.0.0.1:4173/pythonlab/index.html。</p>';
    }
  </script>
  <footer class="lab-footer"><span>Python Lab · 115 學年度資訊科技</span><span>草稿與學習進度只保存在此瀏覽器</span></footer>
  <dialog id="dictionary-dialog" aria-labelledby="dictionary-title">
    <div class="dialog-heading"><div><p class="eyebrow">隨時查，不用離開練習</p><h2 id="dictionary-title">參考小幫手</h2></div><button type="button" id="close-dictionary" class="button" aria-label="關閉參考小幫手，回到練習">回到練習 ✕</button></div>
    <nav id="helper-nav" class="helper-nav" aria-label="參考分類"></nav>
    <p id="helper-context" class="helper-context"></p>
    <label for="dictionary-search">搜尋目前分類的語法、用途或錯誤</label>
    <input id="dictionary-search" type="search" placeholder="例如：迴圈、input、NameError…" autocomplete="off">
    <div id="dictionary-results"></div>
  </dialog>
  <dialog id="certificate-dialog" aria-labelledby="certificate-dialog-title">
    <div class="dialog-heading"><div><p class="eyebrow">留住你的學習成果</p><h2 id="certificate-dialog-title">通關證書</h2></div><button type="button" id="close-certificate" class="button" aria-label="關閉證書，回到練習">回到練習 ✕</button></div>
    <p id="certificate-intro" class="certificate-intro"></p>
    <form id="certificate-form">
      <div class="student-fields">
        <label for="certificate-class">班級<input id="certificate-class" name="className" required maxlength="40" pattern=".*\S.*" autocomplete="off" placeholder="例如：七年一班"></label>
        <label for="certificate-seat">座號<input id="certificate-seat" name="seat" required inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" autocomplete="off" placeholder="例如：08"></label>
        <label for="certificate-name">姓名<input id="certificate-name" name="name" required maxlength="40" pattern=".*\S.*" autocomplete="off" placeholder="請填寫姓名"></label>
      </div>
      <p class="small-label">座號請填 1～999。資料用於本機證書，不會傳送至伺服器；各單元可修改。</p>
      <button type="submit" class="button blue">顯示通關證書</button>
    </form>
    <div id="certificate-view" hidden></div>
    <div class="certificate-actions"><button type="button" id="certificate-edit" class="button quiet" hidden>修改學生資料</button><button type="button" id="certificate-continue" class="button primary">繼續挑戰 →</button></div>
  </dialog>
  <noscript><p class="notice">請啟用 JavaScript，才能使用 Python 課程、語法字典與編輯器。</p></noscript>
</body>
</html>
