<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="learning-guides.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用清單打造星際任務 - LESSON 4</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #333333; }
        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-highlight { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .value-changed { animation: pulse-highlight 0.4s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="antialiased selection:bg-cyan-100 selection:text-cyan-900">

    <!-- Header -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <div class="mb-6">
                <a href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> 
                    返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-cyan-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight">星際陣列指揮官：<br class="hidden md:block">用清單打造星際任務</h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                化身星際指揮官，透過六大任務關卡，循序漸進建立邏輯思維，完整掌握 <span class="font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded-lg border border-cyan-200 mx-1 shadow-sm inline-block whitespace-nowrap">Scratch 清單</span> 的強大威力！
            </p>
        </div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-cyan-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <main id="app-container" class="max-w-5xl mx-auto px-6 lg:px-8 py-12 relative min-h-[50vh]"></main>

    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 text-center">
            <p class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <script>
        // ==========================================
        // 虛擬碼拼圖挑戰邏輯 (階段一與階段二)
        // ==========================================
        const correctPuzzle1Filtered_EN = [
            'DELETE ALL OF "全班同學"',
            'SET 座號 = 0',
            'REPEAT 30 TIMES:',
            '    CHANGE 座號 BY 1',
            '    ADD 座號 TO "全班同學"',
            'SAY "按我，抽出4位同學" FOR 2 SECS'
        ];

        const correctPuzzle1Filtered_ZH = [
            '刪除 "全班同學" 的所有項目',
            '設定 座號 = 0',
            '重複 30 次:',
            '    將 座號 改變 1',
            '    添加 座號 到 "全班同學"',
            '說出 "按我，抽出4位同學" 持續 2 秒'
        ];

        const correctPuzzle2Filtered_EN = [
            'REPEAT 4 TIMES:',
            '    SET 抽出座號 TO GET_ITEM(RANDOM(1, LENGTH("全班同學"))) FROM "全班同學"',
            '    DELETE ITEM (INDEX_OF(抽出座號) IN "全班同學") FROM "全班同學"',
            '    BROADCAST "抽獎"',
            '    SAY 抽出座號 FOR 2 SECS'
        ];

        const correctPuzzle2Filtered_ZH = [
            '重複 4 次:',
            '    設定 抽出座號 = 取出 "全班同學" 的第 (隨機 1 到 "全班同學"長度) 項',
            '    刪除 "全班同學" 裡的第 (找出 抽出座號 在 "全班同學"的項目編號) 項',
            '    廣播訊息 "抽獎"',
            '    說出 抽出座號 持續 2 秒'
        ];

        // 階段一狀態
        let puz1Source = [];
        let puz1Target = [];
        let puz1Solved = false;
        let isPuzzle1ZH = false; 

        function getCorrectPuzzleArray1() {
            return isPuzzle1ZH ? correctPuzzle1Filtered_ZH : correctPuzzle1Filtered_EN;
        }

        function initPuzzle1() {
            puz1Source = [...getCorrectPuzzleArray1()].sort(() => Math.random() - 0.5);
            puz1Target = [];
            puz1Solved = false;
        }

        window.togglePuzzle1Lang = function() {
            if (puz1Solved) return; 
            isPuzzle1ZH = !isPuzzle1ZH;
            initPuzzle1();
            renderPuzzle1();
            
            const langText = document.getElementById('puzzle-lang-text1');
            if (langText) langText.innerText = isPuzzle1ZH ? '切換為英文' : '切換為中文';
            updateIcons();
        }

        window.movePuzzle1Item = function(index, fromSource) {
            if (puz1Solved) return; 
            if (fromSource) {
                puz1Target.push(puz1Source.splice(index, 1)[0]);
            } else {
                puz1Source.push(puz1Target.splice(index, 1)[0]);
            }
            renderPuzzle1();
        }

        window.checkPuzzle1 = function() {
            if (puz1Solved) return;
            const fb = document.getElementById('puzzle1-feedback');
            const currentCorrectArray = getCorrectPuzzleArray1();
            
            if (puz1Target.length < currentCorrectArray.length) {
                fb.innerHTML = '<span class="text-amber-400">⚠️ 請先將所有片段放入組合區！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
                return;
            }

            const isCorrect = puz1Target.every((val, index) => val === currentCorrectArray[index]);
            
            if (isCorrect) {
                puz1Solved = true;
                fb.innerHTML = '<span class="text-emerald-400">🎉 拼圖正確！已解鎖 Scratch 積木！</span>';
                fb.classList.remove('hidden');
                document.getElementById('btn-check-puzzle1').classList.add('hidden');
                const btnLangToggle = document.getElementById('btn-toggle-puzzle-lang1');
                if (btnLangToggle) btnLangToggle.classList.add('hidden');

                const overlay = document.getElementById('scratch-locked-overlay1');
                const blocks = document.getElementById('scratch-blocks-container1');
                if(overlay) overlay.style.opacity = '0';
                if(blocks) blocks.classList.remove('opacity-0', 'blur-sm', 'pointer-events-none');
                setTimeout(() => { if(overlay) overlay.classList.add('hidden'); }, 500);
                
                renderPuzzle1(); 
            } else {
                fb.innerHTML = '<span class="text-rose-400">❌ 順序似乎不對喔，再檢查看看邏輯！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
            }
        }

        function renderPuzzle1() {
            const srcEl = document.getElementById('puzzle1-source');
            const tgtEl = document.getElementById('puzzle1-target');
            if(!srcEl || !tgtEl) return;
            
            if (puz1Solved) {
                srcEl.innerHTML = '<div class="text-slate-500 text-sm w-full text-center py-3 font-bold tracking-widest border border-slate-800 border-dashed rounded-lg bg-slate-900/50">🎉 片段已全數移至組合區</div>';
                tgtEl.innerHTML = puz1Target.map((item, idx) => `
                    <div class="bg-emerald-900/30 text-emerald-200 px-4 py-2.5 rounded-lg font-mono text-sm sm:text-base border border-emerald-700/50 whitespace-pre flex items-center shadow-sm w-full max-w-full overflow-hidden">
                        <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans">${idx + 1}.</span>
                        <span class="ml-2 truncate max-w-full block">${item}</span>
                    </div>
                `).join('');
                return;
            }

            srcEl.innerHTML = puz1Source.map((item, idx) => `
                <div onclick="movePuzzle1Item(${idx}, true)" class="bg-slate-700 text-slate-200 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-600 hover:-translate-y-0.5 font-mono text-sm shadow-sm transition-all border border-slate-600 select-none">
                    ${item.trim()}
                </div>
            `).join('');
            
            tgtEl.innerHTML = puz1Target.map((item, idx) => `
                <div onclick="movePuzzle1Item(${idx}, false)" class="bg-indigo-900/80 text-indigo-100 px-4 py-2.5 rounded-lg cursor-pointer hover:bg-rose-900/80 hover:text-rose-200 font-mono text-sm sm:text-base shadow-sm transition-all border border-indigo-700 select-none flex items-center group w-full max-w-full overflow-hidden">
                    <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans group-hover:hidden">${idx + 1}.</span>
                    <svg class="w-5 h-5 text-rose-400 shrink-0 hidden group-hover:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span class="ml-2 whitespace-pre truncate max-w-full block">${item}</span>
                </div>
            `).join('');
        }
        
        let puz2Source = [];
        let puz2Target = [];
        let puz2Solved = false;
        let isPuzzle2ZH = false; 

        function getCorrectPuzzleArray2() {
            return isPuzzle2ZH ? correctPuzzle2Filtered_ZH : correctPuzzle2Filtered_EN;
        }

        function initPuzzle2() {
            puz2Source = [...getCorrectPuzzleArray2()].sort(() => Math.random() - 0.5);
            puz2Target = [];
            puz2Solved = false;
        }

        window.togglePuzzle2Lang = function() {
            if (puz2Solved) return; 
            isPuzzle2ZH = !isPuzzle2ZH;
            initPuzzle2();
            renderPuzzle2();
            
            const langText = document.getElementById('puzzle-lang-text2');
            if (langText) langText.innerText = isPuzzle2ZH ? '切換為英文' : '切換為中文';
            updateIcons();
        }

        window.movePuzzle2Item = function(index, fromSource) {
            if (puz2Solved) return; 
            if (fromSource) {
                puz2Target.push(puz2Source.splice(index, 1)[0]);
            } else {
                puz2Source.push(puz2Target.splice(index, 1)[0]);
            }
            renderPuzzle2();
        }

        window.checkPuzzle2 = function() {
            if (puz2Solved) return;
            const fb = document.getElementById('puzzle2-feedback');
            const currentCorrectArray = getCorrectPuzzleArray2();
            
            if (puz2Target.length < currentCorrectArray.length) {
                fb.innerHTML = '<span class="text-amber-400">⚠️ 請先將所有片段放入組合區！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
                return;
            }

            const isCorrect = puz2Target.every((val, index) => val === currentCorrectArray[index]);
            
            if (isCorrect) {
                puz2Solved = true;
                fb.innerHTML = '<span class="text-emerald-400">🎉 拼圖正確！已解鎖下方的積木組裝挑戰！</span>';
                fb.classList.remove('hidden');
                document.getElementById('btn-check-puzzle2').classList.add('hidden');
                const btnLangToggle = document.getElementById('btn-toggle-puzzle-lang2');
                if (btnLangToggle) btnLangToggle.classList.add('hidden');

                // 解鎖 Scratch 拼圖
                const overlay = document.getElementById('scratch-locked-overlay2');
                const container = document.getElementById('scratch-puzzle-container');
                if(overlay) overlay.style.opacity = '0';
                if(container) container.classList.remove('opacity-0', 'blur-sm', 'pointer-events-none');
                setTimeout(() => { if(overlay) overlay.classList.add('hidden'); }, 500);
                
                renderPuzzle2(); 
            } else {
                fb.innerHTML = '<span class="text-rose-400">❌ 順序似乎不對喔，再檢查看看邏輯！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
            }
        }

        function renderPuzzle2() {
            const srcEl = document.getElementById('puzzle2-source');
            const tgtEl = document.getElementById('puzzle2-target');
            if(!srcEl || !tgtEl) return;
            
            if (puz2Solved) {
                srcEl.innerHTML = '<div class="text-slate-500 text-sm w-full text-center py-3 font-bold tracking-widest border border-slate-800 border-dashed rounded-lg bg-slate-900/50">🎉 片段已全數移至組合區</div>';
                tgtEl.innerHTML = puz2Target.map((item, idx) => `
                    <div class="bg-emerald-900/30 text-emerald-200 px-4 py-2.5 rounded-lg font-mono text-sm sm:text-base border border-emerald-700/50 whitespace-pre flex items-center shadow-sm w-full max-w-full overflow-hidden">
                        <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans">${idx + 1}.</span>
                        <span class="ml-2 truncate max-w-full block">${item}</span>
                    </div>
                `).join('');
                return;
            }

            srcEl.innerHTML = puz2Source.map((item, idx) => `
                <div onclick="movePuzzle2Item(${idx}, true)" class="bg-slate-700 text-slate-200 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-600 hover:-translate-y-0.5 font-mono text-sm shadow-sm transition-all border border-slate-600 select-none">
                    ${item.trim()}
                </div>
            `).join('');
            
            tgtEl.innerHTML = puz2Target.map((item, idx) => `
                <div onclick="movePuzzle2Item(${idx}, false)" class="bg-indigo-900/80 text-indigo-100 px-4 py-2.5 rounded-lg cursor-pointer hover:bg-rose-900/80 hover:text-rose-200 font-mono text-sm sm:text-base shadow-sm transition-all border border-indigo-700 select-none flex items-center group w-full max-w-full overflow-hidden">
                    <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans group-hover:hidden">${idx + 1}.</span>
                    <svg class="w-5 h-5 text-rose-400 shrink-0 hidden group-hover:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span class="ml-2 whitespace-pre truncate max-w-full block">${item}</span>
                </div>
            `).join('');
        }

        // ==========================================
        // ⭐ 階段二：Scratch 積木引導式提問挑戰
        // ==========================================
        const notchTop = `<div class="absolute top-[-4px] left-4 w-8 h-2 bg-black/20 rounded-b-full"></div>`;
        const notchBottom = `<div class="absolute -bottom-1 left-4 w-8 h-2 bg-black/20 rounded-b-full z-30"></div>`;
        
        // 定義所有積木碎片的完整 HTML (含精美樣式與凹槽)
        const P_HTML = {
            0: `<span class="bg-[#59C059] text-white px-3 py-1 rounded-full border-b-2 border-[#389438] shadow-sm font-bold inline-flex items-center gap-1 leading-none text-sm w-max">隨機取數 <span class="bg-white text-slate-800 px-2 py-0.5 rounded-full shadow-inner text-sm mx-0.5 border border-black/10">1</span> 到 <span class="bg-[#FF661A] text-white px-2 py-0.5 rounded-full border-b-2 border-[#CC5214] shadow-sm text-sm inline-flex items-center"><span class="bg-black/10 px-1 rounded shadow-inner mr-1 text-[11px]">全班同學 ▼</span>的長度</span></span>`,
            1: `<span class="bg-[#FF661A] text-white px-3 py-1.5 rounded-full border-b-2 border-[#CC5214] shadow-sm font-bold inline-flex items-center gap-1 leading-none text-sm w-max"><span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner text-[11px] mr-0.5 inline-flex items-center">全班同學 ▼</span> 的第 __INNER__ 項</span>`,
            2: `<div class="bg-[#FF8C1A] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#DB6E00] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative">${notchTop}變數 <span class="bg-black/15 px-2 py-1 rounded shadow-inner text-[11px] leading-none inline-flex items-center">抽出座號 ▼</span> 設為 __INNER__${notchBottom}</div>`,
            3: `<span class="bg-[#FF661A] text-white px-3 py-1.5 rounded-full border-b-2 border-[#CC5214] shadow-sm font-bold inline-flex items-center gap-1 leading-none text-sm w-max"><span class="bg-[#FF8C1A] text-white px-2 py-0.5 rounded-full shadow-sm border-b-2 border-[#DB6E00] text-sm mr-0.5">抽出座號</span> 在 <span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner text-[11px] mx-0.5 inline-flex items-center">全班同學 ▼</span> 裡的項目編號</span>`,
            4: `<div class="bg-[#FF661A] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#CC5214] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative">${notchTop}刪除 第 __INNER__ 項 <span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner text-[11px] leading-none inline-flex items-center">全班同學 ▼</span>${notchBottom}</div>`,
            5: `<div class="bg-[#FFBF00] text-slate-800 px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#CC9900] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative">${notchTop}廣播訊息 <span class="bg-black/10 text-white px-2 py-1 rounded shadow-inner text-[11px] leading-none inline-flex items-center">抽獎 ▼</span>${notchBottom}</div>`,
            6: `<div class="bg-[#9966FF] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#774DCC] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative">${notchTop}說出 <span class="bg-[#FF8C1A] text-white px-3 py-1 rounded-full shadow-sm border-b-2 border-[#DB6E00] text-sm leading-none mx-0.5">抽出座號</span> 持續 <span class="bg-white text-slate-800 px-3 py-1 rounded-full shadow-inner border border-black/10 font-normal text-sm leading-none mx-0.5">2</span> 秒${notchBottom}</div>`
        };

        // 為零件池準備帶有「空槽視覺」的 HTML
        const P_POOL_HTML = {
            ...P_HTML,
            1: P_HTML[1].replace('__INNER__', `<span class="inline-block w-8 h-4 bg-black/20 rounded shadow-inner"></span>`),
            2: P_HTML[2].replace('__INNER__', `<span class="inline-block w-12 h-6 bg-black/20 rounded-full shadow-inner z-10 relative"></span>`),
            4: P_HTML[4].replace('__INNER__', `<span class="inline-block w-10 h-6 bg-black/20 rounded-full shadow-inner z-10 relative"></span>`)
        };

        // 定義 Q&A 流程與邏輯
        const Q_FLOW = [
            {
                title: "Q1：決定要抽出「籤筒」裡的第幾支籤？",
                desc: "A：從 1 到籤筒（全班同學清單）的總長度中，閉著眼睛隨機挑一個數字！",
                note: "💡 提示：這就像是決定我們要摸出第幾個籤，但還沒看到籤上面寫的號碼喔！",
                expectedPieceId: 0,
                action: (html) => { spStaging = html; }
            },
            {
                title: "Q2：看看這支幸運籤上面寫了什麼座號？",
                desc: "A：把籤筒（全班同學）裡「剛剛決定好的那個位置」的籤拿出來看！",
                note: "💡 提示：使用深橘色的清單讀取積木，把剛剛 Q1 的隨機數字裝進去。",
                expectedPieceId: 1,
                action: (html) => { spStaging = html.replace('__INNER__', spStaging); }
            },
            {
                title: "Q3：把抽到的座號抄在黑板上（記進變數）！",
                desc: "A：把變數 [抽出座號] 的值，設定為剛剛拿出來的那支籤的號碼。",
                note: "💡 提示：使用橘色的變數設定積木，把找到的幸運座號存起來，不然等一下就忘記啦！",
                expectedPieceId: 2,
                action: (html) => { 
                    spLines[0] = html.replace('__INNER__', spStaging); 
                    spStaging = null; 
                }
            },
            {
                title: "Q4：找出剛剛黑板上的號碼，原本是在籤筒的哪個位置？",
                desc: "A：找出 [抽出座號] 在全班同學清單裡的「項目編號」（也就是第幾個位置）。",

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();

        function renderClassListUI() {
            const container = document.getElementById('class-list-container');
            const lengthDisplay = document.getElementById('list-length-display');
            if (!container || !lengthDisplay) return;

            if (classList.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center text-slate-500 py-12 font-bold border-2 border-dashed border-slate-700 rounded-xl">

                    </div>
                `;
                lengthDisplay.innerText = '0';
                updateIcons();
                return;
            }

            container.innerHTML = classList.map((num, idx) => {
                const isHighlight = idx === highlightedIndex;
                const bgClass = isHighlight ? 'bg-amber-400 border-amber-300 ring-4 ring-amber-500/50 scale-110 z-20 shadow-lg shadow-amber-500/50' : 'bg-slate-800 border-slate-600 shadow-sm z-0';
                const textClass = isHighlight ? 'text-slate-900' : 'text-cyan-400';
                const numClass = isHighlight ? 'text-amber-800' : 'text-slate-400';

                return `
                <div class="relative ${bgClass} rounded-lg p-2.5 flex flex-col items-center justify-center transition-all duration-100">
                    <span class="absolute top-1 left-1.5 text-[9px] ${numClass} font-bold">#${idx + 1}</span>
                    <span class="text-xl sm:text-2xl font-mono font-black ${textClass} mt-2">${num}</span>
                </div>
            `}).join('');

            lengthDisplay.innerText = classList.length;
            
            if (!document.getElementById('btn-draw').disabled && isAnimating && highlightedIndex === -1) {
                container.scrollTop = container.scrollHeight;
            }

        async function createClassData() {
            if (isAnimating) return;
            isAnimating = true;
            classList = [];
            highlightedIndex = -1;
            
            const modal = document.getElementById('sim-modal-overlay');
            if (modal) {
                modal.className = 'hidden';
                modal.innerHTML = '';
            }

            renderClassListUI();

            const maxSeats = 30;
            const statusEl = document.getElementById('sim-status-text');
            const btnCreate = document.getElementById('btn-create-data');
            const btnDraw = document.getElementById('btn-draw');

            statusEl.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 inline animate-spin mr-1"></i> 正在執行重複迴圈，建立資料...';
            btnCreate.disabled = true;
            btnCreate.classList.add('opacity-50', 'cursor-not-allowed');
            btnDraw.disabled = true;
            btnDraw.classList.add('opacity-50', 'cursor-not-allowed');
            updateIcons();

            for (let i = 1; i <= maxSeats; i++) {
                await new Promise(r => setTimeout(r, 40)); 
                classList.push(i);
                renderClassListUI();
            }

            statusEl.innerHTML = '✅ 資料建立完成！(長度：30)<br><span class="text-xs text-emerald-600 mt-1 block">請點擊下方按鈕進行「隨機抽籤」。</span>';

            btnCreate.classList.remove('opacity-50', 'cursor-not-allowed');
            btnDraw.disabled = false;
            btnDraw.classList.remove('opacity-50', 'cursor-not-allowed');
            isAnimating = false;
        }

            const btnDraw = document.getElementById('btn-draw');

            btnCreate.classList.add('opacity-50', 'cursor-not-allowed');

            initSimulator();
            
            // 初始化階段一虛擬碼拼圖挑戰
            initPuzzle1();
            renderPuzzle1();
            
            // 初始化階段二雙拼圖挑戰
            initPuzzle2();
            renderPuzzle2();
            initScratchPuzzle2();
            
            // 初始化圖示
            updateIcons();
        };
    </script>
</body>
