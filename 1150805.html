<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="learning-guides.js" defer></script>
    <script src="curriculum-labs.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用清單打造星際任務 - LESSON 5</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #333333; }
        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-highlight { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .value-changed { animation: pulse-highlight 0.4s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="antialiased selection:bg-cyan-100 selection:text-cyan-900">

    <!-- Header -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <div class="mb-6">
                <a href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> 返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-cyan-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight">星際陣列指揮官：<br class="hidden md:block">用清單打造星際任務</h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                化身星際指揮官，透過六大任務關卡，循序漸進建立邏輯思維，完整掌握 <span class="font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded-lg border border-cyan-200 mx-1 shadow-sm inline-block whitespace-nowrap">Scratch 清單</span> 的強大威力！
            </p>
        </div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-cyan-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <main id="app-container" class="max-w-5xl mx-auto px-6 lg:px-8 py-12 relative min-h-[50vh]"></main>

    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 text-center">
            <p class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <script>
        // ==========================================
        // 虛擬碼拼圖挑戰邏輯 (階段一)
        // ==========================================
        const correctPuzzle1Filtered_EN = [
            'DELETE ALL OF "洗牌"',
            'REPEAT LENGTH("牌堆") TIMES:',
            '    SET 第幾張牌 TO RANDOM(1, LENGTH("牌堆"))',
            '    ADD GET_ITEM(第幾張牌) FROM "牌堆" TO "洗牌"',
            '    DELETE ITEM(第幾張牌) FROM "牌堆"'
        ];

        const correctPuzzle1Filtered_ZH = [
            '刪除 "洗牌" 的所有項目',
            '重複 (清單"牌堆"的長度) 次:',
            '    設定 第幾張牌 = 隨機取數 1 到 "牌堆"的長度',
            '    添加 "牌堆" 的第 (第幾張牌) 項 到 "洗牌"',
            '    刪除 "牌堆" 的第 (第幾張牌) 項'
        ];
        
        let puz1Source = [];
        let puz1Target = [];
        let puz1Solved = false;
        let isPuzzle1ZH = false; 

        function getCorrectPuzzleArray1() { return isPuzzle1ZH ? correctPuzzle1Filtered_ZH : correctPuzzle1Filtered_EN; }

        function updateIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function initPuzzle1() {
            puz1Source = [...getCorrectPuzzleArray1()].sort(() => Math.random() - 0.5);
            puz1Target = [];
            puz1Solved = false;
        }

        window.togglePuzzle1Lang = function() {
            if (puz1Solved) return; 
            isPuzzle1ZH = !isPuzzle1ZH;
            initPuzzle1();
            renderPuzzle1();
            const langText = document.getElementById('puzzle-lang-text1');
            if (langText) langText.innerText = isPuzzle1ZH ? '切換為英文' : '切換為中文';
            updateIcons();
        }

        window.movePuzzle1Item = function(index, fromSource) {
            if (puz1Solved) return; 
            if (fromSource) puz1Target.push(puz1Source.splice(index, 1)[0]);
            else puz1Source.push(puz1Target.splice(index, 1)[0]);
            renderPuzzle1();
        }

        window.checkPuzzle1 = function() {
            if (puz1Solved) return;
            const fb = document.getElementById('puzzle1-feedback');
            const currentCorrectArray = getCorrectPuzzleArray1();
            
            if (puz1Target.length < currentCorrectArray.length) {
                fb.innerHTML = '<span class="text-amber-400">⚠️ 請先將所有片段放入組合區！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
                return;
            }

            const isCorrect = puz1Target.every((val, index) => val === currentCorrectArray[index]);
            
            if (isCorrect) {
                puz1Solved = true;
                fb.innerHTML = '<span class="text-emerald-400">🎉 拼圖正確！已解鎖下方的積木碎片！</span>';
                fb.classList.remove('hidden');
                document.getElementById('btn-check-puzzle1').classList.add('hidden');
                const btnLangToggle = document.getElementById('btn-toggle-puzzle-lang1');
                if (btnLangToggle) btnLangToggle.classList.add('hidden');
                
                renderPuzzle1(); 
                renderScratchPuzzle2();
            } else {
                fb.innerHTML = '<span class="text-rose-400">❌ 順序似乎不對喔，再檢查看看邏輯！</span>';
                fb.classList.remove('hidden');
                setTimeout(() => fb.classList.add('hidden'), 3000);
            }
        }

        function renderPuzzle1() {
            const srcEl = document.getElementById('puzzle1-source');
            const tgtEl = document.getElementById('puzzle1-target');
            if(!srcEl || !tgtEl) return;
            
            if (puz1Solved) {
                srcEl.innerHTML = '<div class="text-slate-500 text-sm w-full text-center py-3 font-bold tracking-widest border border-slate-800 border-dashed rounded-lg bg-slate-900/50">🎉 片段已全數移至組合區</div>';
                tgtEl.innerHTML = puz1Target.map((item, idx) => `
                    <div class="bg-emerald-900/30 text-emerald-200 px-4 py-2.5 rounded-lg font-mono text-sm sm:text-base border border-emerald-700/50 whitespace-pre flex items-center shadow-sm w-full max-w-full overflow-hidden">
                        <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans">${idx + 1}.</span>
                        <span class="ml-2 truncate max-w-full block">${item}</span>
                    </div>
                `).join('');
                return;
            }

            srcEl.innerHTML = puz1Source.map((item, idx) => `
                <div onclick="movePuzzle1Item(${idx}, true)" class="bg-slate-700 text-slate-200 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-600 hover:-translate-y-0.5 font-mono text-sm shadow-sm transition-all border border-slate-600 select-none">
                    ${item.trim()}
                </div>
            `).join('');
            
            tgtEl.innerHTML = puz1Target.map((item, idx) => `
                <div onclick="movePuzzle1Item(${idx}, false)" class="bg-indigo-900/80 text-indigo-100 px-4 py-2.5 rounded-lg cursor-pointer hover:bg-rose-900/80 hover:text-rose-200 font-mono text-sm sm:text-base shadow-sm transition-all border border-indigo-700 select-none flex items-center group w-full max-w-full overflow-hidden">
                    <span class="opacity-50 text-xs w-5 shrink-0 text-left font-sans group-hover:hidden">${idx + 1}.</span>
                    <svg class="w-5 h-5 text-rose-400 shrink-0 hidden group-hover:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span class="ml-2 whitespace-pre truncate max-w-full block">${item}</span>
                </div>
            `).join('');
        }

        // ==========================================
        // ⭐ 階段二：Scratch 積木引導式提問挑戰
        // ==========================================
        const notchTop = `<div class="absolute top-[-4px] left-4 w-8 h-2 bg-black/20 rounded-b-full z-30"></div>`;
        const notchBottom = `<div class="absolute -bottom-1 left-4 w-8 h-2 bg-black/20 rounded-b-full z-30"></div>`;
        
        const P_HTML = {
            0: `<div class="bg-[#FFAB19] text-white px-4 py-2.5 rounded-t-lg rounded-br-lg rounded-bl-sm shadow-sm font-bold flex items-center gap-2 w-max text-sm relative border-b-4 border-r-2 border-[#CF8B17] z-20">${notchTop}重複 <span class="bg-[#FF661A] text-white px-3 py-1 rounded-full border-b-2 border-[#CC5214] shadow-sm flex items-center gap-1 mx-1">清單 <span class="bg-black/10 px-1 rounded shadow-inner mx-0.5 text-[11px]">牌堆 ▼</span> 的長度</span> 次${notchBottom}</div>`,
            1: `<span class="bg-[#59C059] text-white px-3 py-1.5 rounded-full border-b-2 border-[#389438] shadow-sm font-bold inline-flex items-center gap-1 leading-none text-sm w-max">隨機取數 <span class="bg-white text-slate-800 px-2 py-0.5 rounded-full shadow-inner text-sm mx-0.5 border border-black/10 font-normal">1</span> 到 <span class="bg-[#FF661A] text-white px-2 py-0.5 rounded-full border-b-2 border-[#CC5214] shadow-sm text-sm inline-flex items-center mx-0.5">清單 <span class="bg-black/10 px-1 rounded shadow-inner mx-1 text-[11px]">牌堆 ▼</span> 的長度</span></span>`,
            2: `<div class="bg-[#FF8C1A] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#DB6E00] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative z-20">${notchTop}變數 <span class="bg-black/15 px-2 py-1 rounded shadow-inner text-[11px] leading-none inline-flex items-center">第幾張牌 ▼</span> 設為 __INNER__${notchBottom}</div>`,
            3: `<div class="bg-[#FF661A] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#CC5214] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative z-20">${notchTop}添加 <span class="bg-[#FF661A] text-white px-2 py-1 rounded-full border-b-2 border-[#CC5214] shadow-sm inline-flex items-center"><span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner mr-1 text-[11px] leading-none inline-flex items-center">牌堆 ▼</span> 的第 <span class="bg-[#FF8C1A] px-2 py-0.5 rounded-full shadow-sm text-[11px] mx-1 border-b-2 border-[#DB6E00]">第幾張牌</span> 項</span> 到 <span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner text-[11px] inline-flex items-center ml-1">洗牌 ▼</span>${notchBottom}</div>`,
            4: `<div class="bg-[#FF661A] text-white px-4 py-2.5 rounded-lg border-b-4 border-r-2 border-[#CC5214] shadow-sm font-bold flex items-center gap-2 w-max text-sm relative z-20">${notchTop}刪除 <span class="bg-black/10 px-1.5 py-0.5 rounded shadow-inner text-[11px] leading-none inline-flex items-center mr-1">牌堆 ▼</span> 的第 <span class="bg-[#FF8C1A] px-2 py-0.5 rounded-full shadow-sm text-[11px] mx-1">第幾張牌</span> 項${notchBottom}</div>`
        };

        const P_POOL_HTML = {
            ...P_HTML,
            2: P_HTML[2].replace('__INNER__', `<span class="inline-block w-12 h-6 bg-black/20 rounded-full shadow-inner z-10 relative"></span>`)
        };

        const Q_FLOW = [
            {
                title: "Q1：決定洗牌的次數！",
                desc: "A：依據「牌堆」目前的長度，重複執行對應的次數。",
                note: "💡 提示：有多少張牌就要洗幾次，請選出包含「清單長度」的橘色重複迴圈積木。",
                expectedPieceId: 0,
                action: (html) => { spLines[0] = html; }
            },
            {
                title: "Q2：決定要抽哪一張牌？",
                desc: "A：從 1 到「牌堆」目前的長度，隨機決定一個數字。",
                note: "💡 提示：用綠色的運算積木產生隨機數字，注意最大值要是牌堆長度喔！",
                expectedPieceId: 1,
                action: (html) => { spStaging = html; }
            },
            {
                title: "Q3：把抽到的牌記在變數裡！",
                desc: "A：將變數 [第幾張牌] 設為剛剛決定的隨機數字。",
                note: "💡 提示：把 Q2 的隨機數字存進變數中，確保等一下拿牌和刪除牌時都是同一張！",
                expectedPieceId: 2,
                action: (html) => { 
                    spLines[1] = html.replace('__INNER__', spStaging); 
                    spStaging = null; 
                }
            },
            {
                title: "Q4：把這張牌放到「洗牌」的新牌堆！",
                desc: "A：將「牌堆」第 [第幾張牌] 項的內容，加到「洗牌」中。",
                note: "💡 提示：這是轉移資料的關鍵步驟，原本整齊的牌被我們轉移放到新牌堆了！",
                expectedPieceId: 3,
                action: (html) => { spLines[2] = html; }
            },
            {
                title: "Q5：把原本的牌丟掉（防重複）",
                desc: "A：刪除「牌堆」的第 [第幾張牌] 項。",
                note: "💡 提示：轉移後一定要從原牌堆刪除它，才不會重複抽到同一張喔！",
                expectedPieceId: 4,
                action: (html) => { spLines[3] = html; }
            }
        ];

        let spStep = 0;
        let spStaging = null;
        let spLines = [null, null, null, null];
        let spPool = [];

        function initScratchPuzzle2() {
            spStep = 0;
            spStaging = null;
            spLines = [null, null, null, null];
            spPool = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5);
            renderScratchPuzzle2();
        }

        window.clickScratchPoolItem = function(pieceId) {
            if(spStep >= Q_FLOW.length) return;
            const currentQ = Q_FLOW[spStep];
            const fb = document.getElementById('sp-feedback');
            
            if(pieceId === currentQ.expectedPieceId) {
                spPool = spPool.filter(id => id !== pieceId);
                currentQ.action(P_HTML[pieceId]);
                spStep++;
                renderScratchPuzzle2();
                
                fb.innerHTML = '<span class="text-emerald-400 font-bold animate-[popIn_0.2s_ease-out]"><i data-lucide="check-circle-2" class="w-5 h-5 inline mr-1"></i> 選擇正確，組合成功！</span>';
                lucide.createIcons();
                setTimeout(() => { if(fb) fb.innerHTML = ''; }, 1500);
            } else {
                fb.innerHTML = '<span class="text-rose-400 font-bold animate-pulse"><i data-lucide="alert-circle" class="w-5 h-5 inline mr-1"></i> 不對喔，請再看一次上方的 A (解答提示)。</span>';
                lucide.createIcons();
                setTimeout(() => { if(fb) fb.innerHTML = ''; }, 2500);
            }
        }

        function renderScratchPuzzle2() {
            const container = document.getElementById('scratch-puzzle-container');
            if (!container) return;

            if (spStep >= Q_FLOW.length) {
                container.innerHTML = `
                    <div class="flex flex-col w-full animate-[slideUpFade_0.5s_ease-out]">
                        <div class="bg-emerald-900/40 border border-emerald-500 p-6 rounded-xl text-center mb-6 shadow-inner relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500 rounded-full mix-blend-screen filter blur-[50px] opacity-20 pointer-events-none"></div>
                            <i data-lucide="party-popper" class="w-12 h-12 text-emerald-400 mx-auto mb-3 animate-bounce"></i>
                            <h4 class="text-emerald-400 font-bold text-2xl mb-2">挑戰成功！</h4>
                            <p class="text-emerald-200 text-sm">您已透過 Q&A 完美還原了「陣列洗牌」的核心精神！</p>
                        </div>
                        <div class="text-slate-400 text-xs font-bold mb-2 flex items-center gap-1.5"><i data-lucide="code-2" class="w-4 h-4"></i> 完整程式積木：</div>
                        <div class="bg-[#F9F9F9] p-6 rounded-xl border border-slate-200 shadow-inner overflow-x-auto custom-scrollbar w-full">
                            <div class="flex flex-col items-start font-bold text-sm md:text-base w-max relative group min-w-full pt-1">
                                ${spLines[0]}
                                <div class="ml-4 pl-3 border-l-[6px] border-[#CF8B17] py-3 bg-[#FFAB19]/10 relative z-10 flex flex-col gap-2 w-max min-h-[100px]">
                                    ${spLines[1]}
                                    ${spLines[2]}
                                    ${spLines[3]}
                                </div>
                                <div class="h-8 w-32 rounded-b-xl border-b-4 border-r-2 shadow-sm bg-[#FFAB19] border-[#CF8B17] relative z-20 flex items-center"></div>
                            </div>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const currentQ = Q_FLOW[spStep];

            container.innerHTML = `
                <!-- 上半部：Q&A 提問與零件區 -->
                <div class="flex flex-col lg:flex-row gap-6 w-full shrink-0">
                    <!-- 左側：Step & Q&A -->
                    <div class="w-full lg:w-5/12 flex flex-col">
                        <div class="bg-indigo-950/60 border border-indigo-800 p-6 rounded-xl shadow-inner relative overflow-hidden h-full flex flex-col justify-center">
                            <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500 rounded-full mix-blend-screen filter blur-[40px] opacity-20 pointer-events-none"></div>
                            <div class="text-indigo-300 font-bold mb-3 tracking-widest text-[11px] uppercase bg-indigo-900/80 w-max px-3 py-1 rounded-md border border-indigo-700 shadow-sm">Step ${spStep + 1} / 5</div>
                            <h5 class="text-white font-extrabold text-xl mb-3 relative z-10 leading-snug">${currentQ.title}</h5>
                            <div class="text-emerald-400 text-sm font-bold mb-4 relative z-10 bg-emerald-950/40 p-3.5 rounded-lg border border-emerald-900/50 leading-relaxed">${currentQ.desc}</div>
                            ${currentQ.note ? `<div class="bg-indigo-900/40 p-4 rounded-lg text-indigo-200 text-sm leading-relaxed border border-indigo-700/50 relative z-10">${currentQ.note}</div>` : ''}
                        </div>
                    </div>

                    <!-- 右側：零件區 (受第一關解鎖控制) -->
                    <div class="w-full lg:w-7/12 flex flex-col">
                        <div class="text-slate-400 text-xs font-bold mb-2 flex items-center gap-1.5"><i data-lucide="mouse-pointer-click" class="w-4 h-4"></i> 請從下方點擊選出對應的積木碎片：</div>
                        <div class="relative flex flex-wrap gap-4 p-5 sm:p-6 bg-slate-900 rounded-xl border border-slate-700 min-h-[200px] content-start shadow-inner flex-1 overflow-hidden">
                            ${!puz1Solved ? `
                            <div class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-md">
                                <div class="bg-slate-800 p-4 rounded-full shadow-lg mb-3 border border-slate-700 shadow-black/50">
                                    <i data-lucide="lock" class="w-8 h-8 text-slate-400"></i>
                                </div>
                                <span class="text-slate-300 font-bold text-sm text-center px-4">請先完成第一關<br>解鎖積木碎片</span>
                            </div>
                            ` : ''}
                            ${spPool.map(id => `
                                <div onclick="${!puz1Solved ? '' : `clickScratchPoolItem(${id})`}" class="${!puz1Solved ? 'opacity-30 pointer-events-none' : 'cursor-pointer hover:scale-[1.03] hover:-translate-y-0.5 active:scale-95'} transition-all shadow-md w-max">
                                    ${P_POOL_HTML[id]}
                                </div>
                            `).join('')}
                        </div>
                        <div id="sp-feedback" class="h-6 mt-3 text-sm text-center"></div>
                    </div>
                </div>

                <!-- 下半部：動態組裝區 (全寬) -->
                <div class="flex flex-col w-full overflow-hidden border-t border-slate-700 pt-6 mt-2">
                    <div class="text-slate-400 text-xs font-bold mb-2 flex items-center gap-1.5"><i data-lucide="package-plus" class="w-4 h-4"></i> 積木組裝區：</div>
                    <div class="bg-[#F9F9F9] p-5 sm:p-6 rounded-xl border border-slate-200 shadow-inner overflow-x-auto custom-scrollbar flex flex-col relative w-full min-h-[220px]">
                        
                        ${spStaging ? `
                        <div class="mb-5 p-5 bg-indigo-50/50 rounded-xl border-2 border-dashed border-indigo-300 shadow-sm animate-[popIn_0.3s_ease-out] w-max max-w-full">
                            <div class="text-xs text-indigo-500 font-bold mb-3 flex items-center gap-1.5"><i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 目前正在組裝中的積木：</div>
                            ${spStaging}
                        </div>
                        ` : ''}

        function renderSimLists(isHighlighting = false) {
            const origContainer = document.getElementById('sim-orig-list');
            const shufContainer = document.getElementById('sim-shuf-list');
            
            origContainer.innerHTML = simOrigList.map((val, idx) => `

                if (simShufList.length === 0) shufContainer.innerHTML = '<div class="text-slate-500 text-sm font-bold w-full text-center py-3">尚未洗牌</div>';
                document.getElementById('sim-shuf-len').innerText = simShufList.length;

        async function doShuffleStep() {
            if(isSimAnimating || simOrigList.length === 0) return;
            isSimAnimating = true;

            const btn = document.getElementById('btn-sim-shuffle');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const randIndex = Math.floor(Math.random() * simOrigList.length);
            
            const jumps = 10;
            for(let i=0; i<jumps; i++) {
                simHighlightIndex = Math.floor(Math.random() * simOrigList.length);
                renderSimLists(true); 
                await new Promise(r => setTimeout(r, 50 + i*10));
            }
            
            simHighlightIndex = randIndex;
            renderSimLists(true);
            
            document.getElementById('sim-status').innerHTML = `從牌堆抽出位置：<span class="text-amber-400 font-bold ml-1">第 ${randIndex + 1} 項</span> (數值 ${simOrigList[randIndex]})`;
            await new Promise(r => setTimeout(r, 600));

            const item = simOrigList[randIndex];
            simOrigList.splice(randIndex, 1);
            simShufList.push(item);
            simHighlightIndex = -1;
            
            renderSimLists(false); 
            document.getElementById('sim-status').innerHTML = `成功將數值 <span class="text-emerald-400 font-bold">${item}</span> 轉移至洗牌清單！`;
            
            if(simOrigList.length === 0) {
                document.getElementById('sim-status').innerHTML = `<span class="text-emerald-400 font-bold">🎉 洗牌完成！所有陣列元素已打亂順序。</span>`;
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            isSimAnimating = false;
        }

        function resetShuffle() {
            if(isSimAnimating) return;
            simOrigList = [1, 2, 3, 4, 5];

            simHighlightIndex = -1;
            renderSimLists(false);
            document.getElementById('sim-status').innerHTML = '點擊「執行洗牌步驟」觀察陣列資料的轉移。';

            btn.classList.remove('opacity-50', 'cursor-not-allowed');

            if (isAdvAnimating || advSourceDeck.length === 0) return;
            isAdvAnimating = true;
            
            const btn = document.getElementById('btn-adv-deal');
            if(btn) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            // 執行圖片上的邏輯：重複 13 次 -> 選牌改變 1 -> 拿走洗牌的第 [選牌] 項
            for(let i=0; i<13; i++) {
                advVarSelect++;
                renderAdvLists(); // 為了高光顯示要拿的牌
                document.getElementById('adv-status').innerHTML = `正在抽取「洗牌清單」的第 <span class="text-emerald-400 font-bold">${advVarSelect}</span> 項 ...`;
                
                await new Promise(r => setTimeout(r, 400));
                
                // 這裡模擬 Scratch 的邏輯，因為陣列會縮短，所以要拿第 advVarSelect 項，在 JS 裡 index 是 advVarSelect - 1
                if (advVarSelect - 1 < advSourceDeck.length) {

                    advPlayerHand.push(item);
                    advSourceDeck.splice(advVarSelect - 1, 1);
