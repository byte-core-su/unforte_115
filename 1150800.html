<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="learning-guides.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用清單打造星際任務</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F8F9FA; 
            color: #333333; 
        }
        
        .slide-up-fade { 
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0; 
        }
        @keyframes slideUpFade { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        .delay-100 { animation-delay: 100ms; }
    </style>
</head>
<body class="antialiased selection:bg-cyan-100 selection:text-cyan-900">

    <!-- Header (首頁與全部頁面保留) - 科技青/星空藍色系 -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <!-- 返回網站首頁按鈕 -->
            <div class="mb-6">
                <a href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> 
                    返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-cyan-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight">星際陣列指揮官：<br class="hidden md:block">用清單打造星際任務</h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                化身星際指揮官，透過六大任務關卡，循序漸進建立邏輯思維，完整掌握 <span class="font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded-lg border border-cyan-200 mx-1 shadow-sm inline-block whitespace-nowrap">Scratch 清單</span> 的強大威力！
            </p>
        </div>
        <!-- 裝飾性背景光暈 -->
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-cyan-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <!-- Main Content Container -->
    <main id="app-container" class="max-w-5xl mx-auto px-6 lg:px-8 py-12 relative min-h-[50vh]">
        <!-- 內容由 JavaScript 動態生成 -->
    </main>

    <!-- Footer -->
    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 text-center">
            <p class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <!-- JavaScript 邏輯 (僅保留首頁資料與邏輯) -->
    <script>
        const lessons = [
            { id: 1, icon: "database", title: "星艦資料庫基礎", subtitle: "(清單原理與概念)", description: "在建立複雜的系統前，我們必須先了解星艦資料庫的最基本單位：數據陣列（清單）。認識什麼是「索引值」，並學會基本操作。" },
            { id: 2, icon: "radio", title: "星際通訊", subtitle: "(小星星廣播)", description: "總部傳來了一段名為《小星星》的神秘頻率。我們需要建立清單來儲存這串音符，並依序播放出來。" },
            { id: 3, icon: "battery-charging", title: "能源庫存分析", subtitle: "(計算總和與平均)", description: "母艦各艙房的能源指數已匯入清單。請指揮官幫忙計算目前的「總能源量」以及「平均能源」，以確保航行安全。" },
            { id: 4, icon: "users", title: "招募先遣隊", subtitle: "(隨機抽號不重複)", description: "我們需要從全班同學中隨機選出 4 位優秀隊員執行先遣任務！記住，已經被選中的隊員不能重複被抽到喔。" },
            { id: 5, icon: "shuffle", title: "武器庫洗牌", subtitle: "(資料移轉與洗牌)", description: "為了對抗外星生物，我們必須將武器庫（撲克牌點數）完全打亂，讓發放順序無法被預測！" },
            { id: 6, icon: "gamepad-2", title: "星際爭霸戰", subtitle: "(綜合應用實戰)", description: "警報！敵軍艦隊來襲！運用我們前五課學到的清單技巧，打造一個星際爭霸遊戲系統，管理敵人生命值與分數吧！" }
        ];

        // 連結至單元頁面
        window.openLesson = function(id) {
            window.location.href = "115080" + id + ".html";
        };

        function renderHomeGrid() {
            let html = `
                <!-- 🚀 情境模擬任務區塊 -->
                <div class="bg-white rounded-3xl shadow-sm border border-cyan-100 p-8 md:p-12 mb-16 slide-up-fade delay-100 relative overflow-hidden group hover:shadow-md transition-shadow duration-300">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-cyan-400 via-blue-400 to-cyan-500"></div>

                    <div class="flex items-center mb-5">
                        <span class="bg-cyan-50 text-cyan-600 border border-cyan-200 px-3 py-1 rounded-full text-xs font-bold tracking-widest shadow-sm">
                            MISSION BRIEFING
                        </span>
                    </div>

                    <h2 class="text-3xl font-bold text-slate-800 mb-4 flex items-center gap-3">
                        <span class="text-4xl group-hover:-translate-y-1 transition-transform duration-300">🚀</span> 
                        情境模擬任務：啟動星艦數據陣列
                    </h2>

                    <p class="text-slate-600 font-medium text-lg mb-8 leading-relaxed">
                        在浩瀚的宇宙中航行，母艦的電腦必須要記錄數百名船員的資料、記錄每一個跳躍座標，甚至是敵方戰機的血量。一般的「變數」一次只能裝一個資料，早就無法負荷了！這時候，我們就需要動用星艦系統的核心技術——<strong class="text-cyan-600">「數據陣列 (清單)」</strong>！
                    </p>

                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-10 flex items-center gap-4 shadow-inner">
                        <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl shadow-sm">👨‍🚀</div>
                        <div>
                            <div class="text-xs text-slate-400 font-bold mb-1 tracking-wider">你的角色</div>
                            <div class="text-xl font-bold text-slate-700">星艦陣列首席指揮官</div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2"><span>🎯</span> 數據陣列核心概念</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:border-cyan-300 hover:shadow-md transition-all">
                            <div class="bg-cyan-100 text-cyan-700 w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold mb-4"><i data-lucide="layers" class="w-5 h-5"></i></div>
                            <h4 class="font-bold text-slate-800 mb-3 text-lg">什麼是清單？</h4>
                            <p class="text-sm text-slate-500 leading-relaxed font-light">一般的變數只能存一個數字。清單就像是一排無限延伸的置物櫃，可以同時儲存全班的成績或整首歌曲的音符！</p>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:border-cyan-300 hover:shadow-md transition-all">
                            <div class="bg-cyan-100 text-cyan-700 w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold mb-4"><i data-lucide="list-ordered" class="w-5 h-5"></i></div>
                            <h4 class="font-bold text-slate-800 mb-3 text-lg">索引值 (Index)</h4>
                            <p class="text-sm text-slate-500 leading-relaxed font-light">清單裡的每個資料都有「座號」，從 1 號開始排。只要告訴電腦座號，就能精準拿出或刪除對應的資料。</p>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:border-cyan-300 hover:shadow-md transition-all">
                            <div class="bg-cyan-100 text-cyan-700 w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold mb-4"><i data-lucide="settings-2" class="w-5 h-5"></i></div>
                            <h4 class="font-bold text-slate-800 mb-3 text-lg">動態管理資料</h4>
                            <p class="text-sm text-slate-500 leading-relaxed font-light">你可以隨時在清單末端「新增」資料、或利用「隨機取數」抽出幸運兒再將他「刪除」，實現抽籤與洗牌演算法。</p>
                        </div>
                    </div>

                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 shadow-sm">
                        <div class="bg-emerald-100 text-emerald-600 w-12 h-12 flex-shrink-0 rounded-full flex items-center justify-center text-2xl">🌍</div>
                        <div>
                            <h3 class="text-emerald-800 font-bold mb-1 text-lg">現實生活應用</h3>
                            <p class="text-emerald-600 text-sm font-medium">購物車清單、遊戲排行榜、班級點名系統、大數據資料收集。</p>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-200 mb-16 slide-up-fade delay-200">

                <!-- 課程單元導覽 -->
                <div class="slide-up-fade delay-200">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                        <div class="flex items-center gap-4">
                            <h2 class="text-2xl font-bold text-slate-800">任務關卡導覽</h2>
                            <a href="11508.zip" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 hover:text-indigo-700 rounded-lg text-sm font-bold transition-colors border border-indigo-200 shadow-sm group active:scale-95">
                                <i data-lucide="download-cloud" class="w-4 h-4 group-hover:-translate-y-0.5 transition-transform"></i>
                                範例程式下載
                            </a>
                        </div>
                        <span class="text-sm font-medium text-slate-400 shrink-0">共 6 個核心關卡</span>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;
            
            lessons.forEach(lesson => {
                const isFinalChallenge = lesson.id === 6;
                let cardClass, tagClass, tagText, titleColor, iconColor;

                if (isFinalChallenge) {
                    cardClass = "block w-full text-left bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-6 hover:shadow-lg hover:border-indigo-400 transition-all group";
                    tagClass = "bg-indigo-100 text-indigo-700 group-hover:bg-indigo-200";
                    tagText = `LESSON ${lesson.id} (最終挑戰)`;
                    titleColor = "text-indigo-900";
                    iconColor = "text-indigo-400 group-hover:text-indigo-600";
                } else {
                    cardClass = "block w-full text-left bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-lg hover:border-cyan-300 transition-all group relative overflow-hidden";
                    tagClass = "bg-slate-100 text-slate-600 group-hover:bg-cyan-50 group-hover:text-cyan-600";
                    tagText = `LESSON ${lesson.id}`;
                    titleColor = "text-slate-800";
                    iconColor = "text-slate-300 group-hover:text-cyan-500";
                }

                html += `
                    <button onclick="openLesson(${lesson.id})" class="${cardClass}">
                        <div class="flex justify-between items-start mb-4 relative z-10">
                            <span class="${tagClass} text-xs font-bold px-3 py-1 rounded-full transition-colors">${tagText}</span>
                            <svg class="w-5 h-5 ${iconColor} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold ${titleColor} mb-2 relative z-10">${lesson.title}</h3>
                        <p class="text-slate-500 text-sm font-light relative z-10">${lesson.description}</p>
                    </button>
                `;
            });
            html += `</div></div>`;
            return html;
        }

        window.onload = function() {
            document.getElementById('app-container').innerHTML = renderHomeGrid();
            lucide.createIcons();
        };
    </script>
</body>
</html>
