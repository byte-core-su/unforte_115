        function initAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playToneByMidi(midiCode, duration = 0.6) {
            initAudio();
            const noteData = PIANO_NOTES[midiCode];
            if (!noteData || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(noteData.freq, audioContext.currentTime);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
            highlightPianoKey(midiCode);
        }

                els.noResults.classList.add('hidden');

                    btn.innerHTML = `<div class="text-sm font-bold ${isSelected ? 'text-indigo-700' : 'text-slate-700'}">${song.title}</div>`;

        function renderJianpuDisplay() {
            if (!selectedSong) return;
            els.songTitle.textContent = selectedSong.title;
            els.songArtist.textContent = isScratchMode ? "讀取模式：Scratch 音階資料" : "讀取模式：標準數字簡譜";
            
            els.jianpuContainer.innerHTML = '';
            const lines = selectedSong.notation.split('/');
            let playIndex = 0;
            
            lines.forEach(line => {
                const lineDiv = document.createElement('div');
                const gapClass = isScratchMode ? "gap-x-1 sm:gap-x-1.5 gap-y-1.5" : "gap-y-2 gap-x-1.5 sm:gap-x-2";
                lineDiv.className = `flex flex-wrap items-center justify-start ${gapClass} w-full pb-3 border-b border-slate-100/50 last:border-b-0`;
                const tokens = line.trim().split(/\s+/).filter(t => t !== '');
                
                tokens.forEach((token) => {
                    const span = document.createElement('span');
                    const isCurrent = isPlaying && playIndex === currentPlayIndex;
                    
                    if (token === '|') {
                        span.className = `mx-1 sm:mx-2 text-slate-300 font-light text-lg transition-all duration-200 flex-shrink-0 ${isCurrent ? 'text-indigo-500 scale-110' : ''}`;
                        span.textContent = '|';
                    } else if (token === '-' || token === '0') {
                        span.className = `w-3 sm:w-5 border-b-2 border-slate-400 inline-block align-middle transform -translate-y-1/2 mx-0.5 flex-shrink-0 opacity-50`;
                    } else if (token === '.') {
                        span.className = `text-sm self-end mb-0.5 font-bold text-indigo-600 flex-shrink-0`;
                        span.textContent = '.';
                    } else {
                        const normalizedToken = token.replace('.', '̇');
                        const targetMidi = JIANPU_TO_MIDI[normalizedToken] || JIANPU_TO_MIDI[token];
                        const displayToken = (isScratchMode && targetMidi) ? PIANO_NOTES[targetMidi].scratch : normalizedToken;
                        const paddingClass = isScratchMode ? "px-1.5 py-1 min-w-[2.25rem] sm:min-w-[2.75rem]" : "px-2 min-w-[2rem] sm:min-w-[2.25rem]";
                        const textSize = isScratchMode ? 'text-[10px] sm:text-xs' : 'text-base sm:text-lg';
                        
                        span.className = `relative inline-flex items-center justify-center h-7 sm:h-8 ${paddingClass} rounded-full transition-all duration-200 border flex-shrink-0 ${
                            isCurrent ? 'bg-indigo-600 text-white border-indigo-600 scale-105 shadow-sm ring-2 ring-indigo-200' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'
                        } ${textSize} font-bold`;
                        span.textContent = displayToken;
                    }
                    span.id = `token-${playIndex}`;
                    lineDiv.appendChild(span);
                    playIndex++;
                });
                els.jianpuContainer.appendChild(lineDiv);
            });
        }

        function createPianoHTML() {
            const whiteKeys = Object.keys(PIANO_NOTES).filter(k => PIANO_NOTES[k].type === 'white');

            let html = '';
            
            whiteKeys.forEach(midiCode => {
                const note = PIANO_NOTES[midiCode];
                const displayLabel = isScratchMode ? note.scratch : note.jianpu;
                const textSize = isScratchMode ? 'text-[10px] sm:text-xs' : 'text-sm sm:text-base';
                html += `

                        <span class="text-[9px] opacity-70 uppercase pointer-events-none mt-0.5 font-medium">${note.name}</span>
                    </div>`;
            });

            blackKeys.forEach(midiCode => {
                const note = PIANO_NOTES[midiCode];
                const displayLabel = isScratchMode ? note.scratch : note.jianpu;
                const textSize = isScratchMode ? 'text-[8px] sm:text-[9px]' : 'text-[10px] sm:text-xs';
                html += `
                    <div id="key-auto-${midiCode}" class="absolute w-[6%] h-3/5 rounded-b-lg shadow-lg flex flex-col justify-end items-center pb-2 transition-all duration-100 bg-slate-800 border-slate-900 text-white" style="left: ${note.leftOffset}; z-index: 10;">

            return html;

        function highlightPianoKey(midiCode) {
            if (activePianoKey) {
                const autoKey = document.getElementById(`key-auto-${activePianoKey}`);
                const noteData = PIANO_NOTES[activePianoKey];
                if (autoKey && noteData) autoKey.classList.remove('key-pressed', noteData.type==='white' ? 'key-active-white' : 'key-active-black');
            }
            activePianoKey = midiCode;
            if (midiCode) {
                const autoKey = document.getElementById(`key-auto-${midiCode}`);
                const noteData = PIANO_NOTES[midiCode];
                if (autoKey && noteData) {
                    const activeClass = noteData.type === 'white' ? 'key-active-white' : 'key-active-black';
                    autoKey.classList.add('key-pressed', activeClass);
                    setTimeout(() => {
                        if (activePianoKey === midiCode) {
                            autoKey.classList.remove('key-pressed', activeClass);
                            activePianoKey = null;
                        }
                    }, 200);
                }
            }
        }

        function updatePlayUI() {
            if (isPlaying) {
                els.btnPlay.classList.add('hidden');
                els.btnStop.classList.remove('hidden', 'flex');
                els.btnStop.classList.add('flex');
                els.playingIndicator.classList.remove('hidden');
            } else {
                els.btnPlay.classList.remove('hidden');

                els.btnStop.classList.remove('flex');

            }
        }

        function stopAutoPlay() {
            if (playTimeout) {
                clearTimeout(playTimeout);
                playTimeout = null;
            }
            isPlaying = false;
            currentPlayIndex = -1;
            updatePlayUI();
        }

        function startAutoPlay(song) {
            stopAutoPlay();
            initAudio();
            isPlaying = true;
            updatePlayUI();

            const tokens = song.notation.replace(/\//g, ' ').split(/\s+/).filter(t => t !== '');
            let index = 0;

            const playNextStep = () => {
                if (index >= tokens.length) {
                    stopAutoPlay();
                    return;
                }

                currentPlayIndex = index;
                
                for(let i=0; i<tokens.length; i++) {
                    const t = document.getElementById(`token-${i}`);
                    if(t) {
                        if (t.textContent === '|') {
                            t.className = "mx-1 sm:mx-2 text-slate-300 font-light text-lg transition-all duration-200 flex-shrink-0";
                        } else if (t.textContent !== '-' && t.textContent !== '0' && t.textContent !== '.') {
                            const textSize = isScratchMode ? 'text-[10px] sm:text-xs' : 'text-base sm:text-lg';
                            const paddingClass = isScratchMode ? "px-1.5 py-1 min-w-[2.25rem] sm:min-w-[2.75rem]" : "px-2 min-w-[2rem] sm:min-w-[2.25rem]";
                            t.className = `relative inline-flex flex-shrink-0 items-center justify-center h-7 sm:h-8 ${paddingClass} rounded-full transition-all duration-200 border bg-white text-slate-800 border-slate-200 ${textSize} font-bold`;
                        }
                    }
                }
                
                const currentEl = document.getElementById(`token-${index}`);
                const token = tokens[index];

                if (currentEl) {
                    if (token === '|') {
                        currentEl.classList.add('text-indigo-500', 'scale-110');
                    } else if (token !== '-' && token !== '0' && token !== '.') {
                        currentEl.classList.remove('bg-white', 'text-slate-800', 'border-slate-200');
                        currentEl.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'scale-105', 'shadow-sm', 'ring-2', 'ring-indigo-200');
                        currentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }

                if (token === '|') {
                    index++;
                    playNextStep();
                    return;
                }

                if (token !== '-' && token !== '0' && token !== '.') {
                    const normalizedToken = token.replace('.', '̇');
                    const targetMidi = JIANPU_TO_MIDI[normalizedToken] || JIANPU_TO_MIDI[token];
                    if (targetMidi) playToneByMidi(targetMidi, 0.4);
                }

                index++;
                playTimeout = setTimeout(playNextStep, 400);
            };
            playNextStep();
        }

        function autoCorrelate(buffer, sampleRate, noiseThreshold) {
            let SIZE = buffer.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
            rms = Math.sqrt(rms / SIZE);
            const dbThreshold = noiseThreshold / 200.0; 
            if (rms < dbThreshold) return -1;

            let r1 = 0, r2 = SIZE - 1;
            let thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
            for (let i = SIZE - 1; i >= SIZE / 2; i--) if (Math.abs(buffer[i]) < thres) { r2 = i; break; }
            let buf = buffer.slice(r1, r2);
            let len = buf.length;
            if (len < 64) return -1;

            let c = new Float32Array(len);
            for (let i = 0; i < len; i++) {
                for (let j = 0; j < len - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }
            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < len; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);
            return sampleRate / T0;
        }

        function noteFromPitch(frequency) {
            let noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
            return Math.round(noteNum) + 69;
        }

        function midiToNumbered(midiNumber) {
            const noteInOctave = midiNumber % 12;
            const map = { 0: '1', 2: '2', 4: '3', 5: '4', 7: '5', 9: '6', 11: '7' };
            return map[noteInOctave] || null; 
        }

        function calculateEnhancedMatch(studentEvents, templateNotation, songTitle, songArtist) {
            const template = templateNotation.replace(/[^1-7]/g, '').split('');
            const studentSeq = studentEvents.map(e => e.note);

            const n = studentSeq.length;
            const m = template.length;
            
            const dp = Array(n + 1).fill(0).map(() => Array(m + 1).fill(0));

            for (let i = 1; i <= n; i++) dp[i][0] = i;
            for (let j = 1; j <= m; j++) dp[0][j] = j;

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    if (studentSeq[i - 1] === template[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1]; 
                    } else {
                        dp[i][j] = Math.min(
                            dp[i - 1][j] + 1,       // Extra 
                            dp[i][j - 1] + 1,       // Miss 
                            dp[i - 1][j - 1] + 1    // Wrong 
                        );
                    }
                }
            }

            let i = n, j = m;
            let alignment = [];
            let extraCount = 0;
            let missCount = 0;
            let wrongCount = 0;
            let matchCount = 0;

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && studentSeq[i - 1] === template[j - 1]) {
                    alignment.unshift({ templateNote: template[j - 1], studentNote: studentSeq[i - 1], status: 'match' });
                    matchCount++;
                    i--; j--;
                } else if (j > 0 && (i === 0 || (dp[i][j - 1] <= dp[i - 1][j] && dp[i][j - 1] <= dp[i - 1][j - 1]))) {
                    alignment.unshift({ templateNote: template[j - 1], studentNote: '漏', status: 'miss' });
                    missCount++;
                    j--;
                } else if (i > 0 && j > 0 && (dp[i - 1][j - 1] <= dp[i - 1][j] && dp[i - 1][j - 1] <= dp[i][j - 1])) {
                    alignment.unshift({ templateNote: template[j - 1], studentNote: studentSeq[i - 1], status: 'wrong' });
                    wrongCount++;
                    i--; j--;
                } else {
                    alignment.unshift({ templateNote: '-', studentNote: studentSeq[i - 1], status: 'extra' });
                    extraCount++;
                    i--;
                }
            }

            const totalTarget = template.length;
            const finalScore = totalTarget > 0 ? Math.round((matchCount / totalTarget) * 100) : 100;

            return {
                score: finalScore,
                editDistance: dp[n][m], 
                matched: matchCount,
                missed: missCount,
                wrong: wrongCount,
                extra: extraCount,
                totalSteps: totalTarget,
                matchedSong: songTitle,
                artist: songArtist,
                alignment
            };
        }

        function handleScoring(studentEvents, targetMode) {
            if (targetMode === 'auto_detect') {
                let bestMatch = null;
                SONGS.forEach(song => {
                    const res = calculateEnhancedMatch(studentEvents, song.notation, song.title, song.artist);
                    const lengthRatio = Math.max(studentEvents.length, res.totalSteps) / Math.min(studentEvents.length, res.totalSteps);
                    const weightedDistance = res.editDistance * (lengthRatio > 1.5 ? lengthRatio * 1.5 : 1);

                    if (!bestMatch) {
                        bestMatch = { res, weightedDistance };
                    } else {
                        if (weightedDistance < bestMatch.weightedDistance) {
                            bestMatch = { res, weightedDistance };
                        } else if (weightedDistance === bestMatch.weightedDistance && res.score > bestMatch.res.score) {
                            bestMatch = { res, weightedDistance };
                        }
                    }
                });

                if (bestMatch && bestMatch.res.score !== -1) {
                    finalizeAnalysisUI(bestMatch.res);
                } else {
                    showAiError("無法識別您的樂曲，請手動選擇目標頻率後再試一次！");
                }
            } else {
                const targetSong = SONGS.find(s => s.title === targetMode);
                if (targetSong) {
                    const res = calculateEnhancedMatch(studentEvents, targetSong.notation, targetSong.title, targetSong.artist);
                    finalizeAnalysisUI(res);
                } else {
                    showAiError("找不到指定的目標頻率，請重新選擇。");
                }
            }
        }

        async function startAiAnalysis(file) {
            els.btnStartAi.disabled = true;
            els.btnStartAi.className = "w-full py-4 mt-auto rounded-xl font-bold text-white bg-indigo-600 opacity-70 cursor-not-allowed shadow-sm transition-all";
            els.btnStartAi.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 inline animate-spin mr-2"></i> 分析比對中...';
            els.aiProgressContainer.classList.remove('hidden');
            
            els.aiResultDashboard.innerHTML = `
                <div class="text-indigo-400 text-center flex flex-col items-center gap-4 py-12">
                    <i data-lucide="loader-2" class="w-12 h-12 animate-spin"></i>
                    <p class="font-bold tracking-wide">正在從音軌中提取陣列特徵...</p>
                </div>
            `;
            lucide.createIcons();

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const offlineCtx = new AudioContext();
                const fileReader = new FileReader();

                fileReader.onload = async (e) => {
                    try {
                        els.aiProgressText.innerText = "⏳ 數位音軌解碼中...";
                        const arrayBuffer = e.target.result;
                        const audioBuffer = await offlineCtx.decodeAudioData(arrayBuffer);

                        els.aiProgressText.innerText = "🔍 DP 陣列對位與評分中...";
                        const sampleRate = audioBuffer.sampleRate;
                        const channelData = audioBuffer.getChannelData(0);

                        const frameSize = 2048;
                        const hopSize = 1024;
                        const totalSamples = channelData.length;

                        let historyList = [];
                        let lastNoteNumbered = null;
                        let lastNoteTime = 0;
                        let silenceDuration = 0;
                        
                        const stateSensitivity = 3.0; 
                        const noiseThreshold = 15;    

                        let start = 0;

                        const processChunk = () => {
                            const CHUNK_LIMIT = hopSize * 80; 
                            const targetEnd = Math.min(start + CHUNK_LIMIT, totalSamples - frameSize);

                            while (start < targetEnd) {
                                const chunk = channelData.subarray(start, start + frameSize);
                                const pitch = autoCorrelate(chunk, sampleRate, noiseThreshold);
                                const currentTime = (start + frameSize / 2) / sampleRate;

                                if (pitch !== -1) {
                                    silenceDuration = 0;
                                    const midi = noteFromPitch(pitch);
                                    
                                    if (midi >= 12 && midi <= 127) {
                                        const numberedNote = midiToNumbered(midi);
                                        if (numberedNote) {
                                            const timeGap = currentTime - lastNoteTime;
                                            let isNewAttack = false;

                                            if (lastNoteNumbered === null) {
                                                isNewAttack = true;
                                            } else if (numberedNote !== lastNoteNumbered) {
                                                if (timeGap >= (stateSensitivity * 0.05)) isNewAttack = true;
                                            } else {
                                                if (timeGap >= 0.45) isNewAttack = true;
                                            }

                                            if (isNewAttack && (timeGap >= 0.1 || lastNoteTime === 0)) {
                                                historyList.push({ time: currentTime, note: numberedNote });
                                                lastNoteNumbered = numberedNote;
                                                lastNoteTime = currentTime;
                                            }
                                        }
                                    }
                                } else {
                                    silenceDuration += (hopSize / sampleRate);
                                    if (silenceDuration >= 0.15) lastNoteNumbered = null;
                                }
                                start += hopSize;
                            }

                            const percent = Math.round((start / totalSamples) * 100);
                            els.aiProgressPercent.innerText = percent + "%";
                            els.aiProgressBar.style.width = percent + "%";

                            if (start < totalSamples - frameSize) {
                                requestAnimationFrame(processChunk); 
                            } else {
                                const targetMode = els.aiTargetSongSelect.value;
                                handleScoring(historyList, targetMode);
                            }
                        };

                        processChunk();

                    } catch(err) {
                        showAiError("音軌分離失敗：您上傳的影片可能不包含聲音，或檔案格式損壞。");
                    }
                };
                
                fileReader.readAsArrayBuffer(file);

            } catch (error) {
                showAiError("處理過程中發生系統異常，請嘗試重新操作！");
            }
        }

        function finalizeAnalysisUI(res) {
            els.btnStartAi.disabled = false;
            els.btnStartAi.className = "w-full py-4 mt-auto rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition-all shadow-sm";
            els.btnStartAi.innerHTML = '🔄 重新分析上傳的檔案';

            let alignmentHtml = res.alignment.map(col => {
                let statusColor = col.status === 'match' ? 'bg-emerald-950/60 border-emerald-900/60' :
                                  col.status === 'miss' ? 'bg-slate-800/40 border-slate-700/60' :
                                  col.status === 'wrong' ? 'bg-amber-950/40 border-amber-900/60' :
                                  'bg-rose-950/40 border-rose-900/60';
                
                let statusTextColor = col.status === 'match' ? 'text-emerald-400' :
                                      col.status === 'miss' ? 'text-slate-600' :
                                      col.status === 'wrong' ? 'text-amber-400' :
                                      'text-rose-400';
                                      
                let icon = col.status === 'match' ? '✅' :
                           col.status === 'miss' ? '➖' :
                           col.status === 'wrong' ? '⚠️' : '❌';

                return `
                    <div class="flex flex-col items-center shrink-0 w-12 border rounded-xl py-2 shadow-sm ${statusColor}">
                        <div class="text-[10px] text-slate-500 font-bold mb-1 border-b border-slate-800/80 w-full text-center pb-1.5" title="目標陣列">${col.templateNote === '0' ? '休' : col.templateNote}</div>
                        <div class="text-xs my-1">${icon}</div>
                        <div class="text-base font-black ${statusTextColor}" title="您的採樣">${col.studentNote === '0' ? '休' : col.studentNote}</div>
                    </div>`;
            }).join('');

            els.aiResultDashboard.innerHTML = `
                <div class="w-full flex flex-col items-center animate-[popIn_0.5s_ease-out_forwards]">
                    
                    <div class="text-center mb-4">
                        <div class="text-xs font-bold text-slate-500 mb-1">🎯 系統對齊目標陣列</div>
                        <div class="text-2xl font-black text-indigo-400">【${res.matchedSong}】</div>
                    </div>

                    <div class="bg-slate-950 p-6 rounded-2xl border border-emerald-600/80 shadow-lg shadow-emerald-950/40 w-full max-w-lg mb-6 relative overflow-hidden flex flex-col items-center">
                        <div class="absolute -right-6 -top-4 bg-emerald-600 text-white text-[10px] font-black uppercase py-1 px-8 rotate-45 transform shadow-md">
                            達成率
                        </div>
                        <div class="flex justify-between items-center w-full mb-2">
                            <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                                <span>🎵 序列 DP 動態規劃分析</span>
                                <span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-normal">精確捕捉漏錯音</span>
                            </span>
                        </div>
                        
                        <div class="flex items-baseline gap-1 my-3">
                            <span class="text-6xl font-black text-white">${res.score}</span>
                            <span class="text-slate-400 text-lg font-bold">分</span>
                        </div>

                        <div class="text-xs text-slate-400 space-y-2 mt-4 border-t border-slate-900 pt-4 w-full">
                            <div class="flex justify-between"><span>✅ 完全吻合 (陣列達成率)</span><span class="font-bold text-emerald-400">${res.matched} / ${res.totalSteps}</span></div>
                            <div class="flex justify-between"><span>➖ 漏彈/漏吹</span><span class="font-bold text-slate-500">${res.missed} 次</span></div>
                            <div class="flex justify-between"><span>⚠️ 彈錯音階 (不倒扣)</span><span class="font-bold text-amber-400">${res.wrong} 次</span></div>
                            <div class="flex justify-between"><span>❌ 冗餘音/多彈 (不倒扣)</span><span class="font-bold text-rose-400">${res.extra} 次</span></div>
                        </div>
                    </div>

                    <div class="w-full bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner">
                        <h5 class="text-sm font-bold text-slate-300 mb-4 flex items-center justify-between">
                            <span class="flex items-center gap-2">
                                <i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-400"></i>
                                編輯距離 (Edit Distance) 視覺化對位
                            </span>
                            <span class="text-[10px] text-slate-500">總步數: ${res.alignment.length}</span>
                        </h5>
                        <div class="flex overflow-x-auto pb-4 gap-2 custom-scrollbar">
                            ${alignmentHtml}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function showAiError(msg) {
            els.btnStartAi.disabled = false;
            els.btnStartAi.className = "w-full py-4 mt-auto rounded-xl font-bold text-white bg-slate-700 hover:bg-slate-600 transition-all shadow-sm";
            els.btnStartAi.innerHTML = '🔄 系統異常，點擊重試';
            els.aiProgressContainer.classList.add('hidden');
            els.aiResultDashboard.innerHTML = `
                <div class="text-rose-400 text-center flex flex-col items-center gap-4 py-12">
                    <i data-lucide="alert-triangle" class="w-16 h-16 opacity-70"></i>
                    <p class="text-sm font-bold tracking-wide">${msg}</p>
                </div>
            `;
            lucide.createIcons();
        }

        function shuffleSongs() {
            const others = SONGS.slice(1);
            for (let i = others.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [others[i], others[j]] = [others[j], others[i]];
            }
            SONGS.splice(1, others.length, ...others);
        }

        // ================= 初始化執行 =================
        window.onload = function() {
            document.getElementById('app-container').innerHTML = renderLessonDetail(lesson);
            initDOM();
            populateAiTargetSelect(); 
            shuffleSongs();
            selectedSong = SONGS[0]; 
            setupEventListeners();
            renderAll();
            lucide.createIcons();
        };
    </script>
