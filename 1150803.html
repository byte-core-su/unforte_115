<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="learning-guides.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用清單打造星際任務</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; color: #333333; }
        .slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse-highlight { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .value-changed { animation: pulse-highlight 0.4s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="antialiased selection:bg-cyan-100 selection:text-cyan-900">

    <!-- Header -->
    <header id="main-header" class="bg-white border-b border-gray-100 pt-12 pb-12 slide-up-fade relative overflow-hidden">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 relative z-10">
            <div class="mb-6">
                <a href="index.html" class="inline-flex items-center text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> 
                    返回網站首頁
                </a>
            </div>
            <p class="text-sm font-bold text-cyan-600 mb-3 tracking-widest uppercase">演算法與程式設計</p>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-6 tracking-tight">星際陣列指揮官：<br class="hidden md:block">用清單打造星際任務</h1>
            <p class="text-lg text-slate-500 font-light max-w-2xl leading-relaxed">
                化身星際指揮官，透過六大任務關卡，循序漸進建立邏輯思維，完整掌握 <span class="font-bold text-cyan-700 bg-cyan-50 px-2 py-1 rounded-lg border border-cyan-200 mx-1 shadow-sm inline-block whitespace-nowrap">Scratch 清單</span> 的強大威力！
            </p>
        </div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-cyan-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute bottom-0 right-40 w-72 h-72 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </header>

    <main id="app-container" class="max-w-5xl mx-auto px-6 lg:px-8 py-12 relative min-h-[50vh]"></main>

    <footer class="bg-slate-50 border-t border-slate-200 mt-10 py-8">
        <div class="max-w-5xl mx-auto px-6 lg:px-8 text-center">
            <p class="text-sm font-medium text-slate-400">© 演算法與程式設計 - 星際陣列指揮官</p>
        </div>
    </footer>

    <script>
        // --- 共用動畫函式 ---
        function triggerValueChangeAnimation(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('value-changed');
                void el.offsetWidth; // trigger reflow
                el.classList.add('value-changed');
            }
        }

        // ==========================================
        // 🚀 課前暖身活動：單純變數累加邏輯
        // ==========================================
        let warmLoopCount = 0;
        let warmTotal = 0;
        let warmIndex = 0;
        const WARM_MAX_LOOPS = 5;
        let warmFinished = false;

        function checkWarmupAnswers() {
            const b1 = document.getElementById('q-blank-1').value;
            const b2 = document.getElementById('q-blank-2').value;
            const b3 = document.getElementById('q-blank-3').value;
            const b4 = document.getElementById('q-blank-4').value;
            const b5 = document.getElementById('q-blank-5').value;

            if (b1 === "序號" && b2 === "改變" && b3 === "累加值" && b4 === "累加值" && b5 === "序號") {
                document.getElementById('warmup-quiz-feedback').innerHTML = "<div class='text-emerald-400 font-bold bg-emerald-950/50 p-2 rounded mt-2 border border-emerald-800'>✅ 邏輯完全正確！變數鎖定，請開始執行迴圈。</div>";
                document.getElementById('warm-math-text').innerText = "等待啟動...";
                document.getElementById('warm-math-text').className = "h-6 mt-1 text-sm font-bold text-pink-400 shrink-0";
                
                const historyEl = document.getElementById('warm-history');
                if(historyEl) {
                    historyEl.innerHTML = "";
                    historyEl.classList.remove('hidden');
                }

                const btnVerify = document.getElementById('btn-warm-verify');
                const btnNext = document.getElementById('btn-warm-next');
                btnVerify.classList.remove('flex');
                btnVerify.classList.add('hidden');
                btnNext.classList.remove('hidden');
                btnNext.classList.add('flex');
                
                for(let i=1; i<=5; i++) document.getElementById(`q-blank-${i}`).disabled = true;
            } else {
                document.getElementById('warmup-quiz-feedback').innerHTML = "<div class='text-rose-400 font-bold bg-rose-950/50 p-2 rounded mt-2 border border-rose-800'>❌ 邏輯不對喔！請檢查誰該遞增？誰該負責儲存總和？</div>";
            }
        }

        function warmNextStep() {
            if (warmFinished) return;
            
            if (warmLoopCount < WARM_MAX_LOOPS) {
                let oldTotal = warmTotal;
                let oldIndex = warmIndex;
                
                warmIndex++; 
                warmTotal += warmIndex; 
                warmLoopCount++;
                
                document.getElementById('warm-index-text').innerText = warmIndex;
                document.getElementById('warm-total-text').innerText = warmTotal;
                document.getElementById('warm-loop-text').innerText = `${warmLoopCount} / ${WARM_MAX_LOOPS} 次`;
                document.getElementById('warm-loop-bar').style.width = `${(warmLoopCount / WARM_MAX_LOOPS) * 100}%`;
                
                const historyEl = document.getElementById('warm-history');
                if (historyEl) {
                    historyEl.classList.remove('hidden');
                    const logItem = document.createElement('div');
                    logItem.className = "bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 text-slate-300 text-xs sm:text-sm animate-[popIn_0.3s_ease-out]";
                    logItem.innerHTML = `<span class="text-indigo-400 font-bold">第 ${warmLoopCount} 次：</span> 序號👉<span class="text-white font-mono">${warmIndex}</span>，累加值 <span class="text-emerald-400 font-mono">${oldTotal} + ${warmIndex} = ${warmTotal}</span>`;
                    historyEl.appendChild(logItem);
                }
                
                document.getElementById('warm-math-text').innerHTML = `計算中：<span class="text-white">${oldTotal} + ${warmIndex} = ${warmTotal}</span>`;
                
                triggerValueChangeAnimation('warm-index-text');
                triggerValueChangeAnimation('warm-total-text');
                
                if (warmLoopCount >= WARM_MAX_LOOPS) {
                    warmFinished = true;
                    document.getElementById('warm-math-text').innerHTML = "🎉 迴圈執行完畢！(1 加到 5 的總和是 15)";
                    document.getElementById('warm-math-text').className = "h-6 mt-1 text-sm font-bold text-emerald-400 shrink-0";
                    
                    const btn = document.getElementById('btn-warm-next');
                    btn.disabled = true;
                    btn.className = 'flex-1 bg-slate-700 text-slate-400 font-bold py-3 px-4 rounded-xl shadow-inner flex items-center justify-center gap-2 cursor-not-allowed';
                    btn.innerHTML = '<i data-lucide="check-circle-2" class="w-5 h-5"></i> 暖身完成';
                    lucide.createIcons();
                }
            }
        }
        
        function warmReset() {
            warmLoopCount = 0;
            warmTotal = 0;
            warmIndex = 0;
            warmFinished = false;
            
            document.getElementById('warm-index-text').innerText = warmIndex;
            document.getElementById('warm-total-text').innerText = warmTotal;
            document.getElementById('warm-loop-text').innerText = `0 / ${WARM_MAX_LOOPS} 次`;
            document.getElementById('warm-loop-bar').style.width = "0%";
            document.getElementById('warm-math-text').innerText = "請先完成上方的邏輯配合題";
            document.getElementById('warm-math-text').className = "h-6 mt-1 text-sm font-bold text-slate-400 shrink-0";
            
            const historyEl = document.getElementById('warm-history');
            if(historyEl) {
                historyEl.innerHTML = "";
                historyEl.classList.add('hidden');
            }

            for(let i=1; i<=5; i++) {
                const sel = document.getElementById(`q-blank-${i}`);
                if(sel) { sel.value = ""; sel.disabled = false; }
            }
            document.getElementById('warmup-quiz-feedback').innerHTML = "";

            const btnVerify = document.getElementById('btn-warm-verify');
            const btnNext = document.getElementById('btn-warm-next');
            if(btnVerify) {
                btnVerify.classList.remove('hidden');
                btnVerify.classList.add('flex');
            }
            if(btnNext) {
                btnNext.disabled = false;
                btnNext.className = 'hidden flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95 items-center justify-center gap-2';
                btnNext.innerHTML = '<i data-lucide="zap" class="w-5 h-5"></i> 執行迴圈 (下一步)';
            }
            lucide.createIcons();
        }

        function initWarmup() {
            document.getElementById('btn-warm-verify')?.addEventListener('click', checkWarmupAnswers);
            document.getElementById('btn-warm-next')?.addEventListener('click', warmNextStep);
            document.getElementById('btn-warm-reset')?.addEventListener('click', warmReset);
        }

        function renderWarmupHTML() {
            return `
                <div class="bg-indigo-950/90 rounded-2xl border border-indigo-800 p-6 flex flex-col md:flex-row gap-6 shadow-xl relative overflow-hidden mb-12">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500 rounded-full mix-blend-screen filter blur-[60px] opacity-20 pointer-events-none"></div>
                    
                    <div class="w-full md:w-1/2 flex flex-col gap-4 z-10">
                        <div class="text-indigo-200 text-sm font-medium mb-1 leading-relaxed">
                            在處理複雜的「陣列」之前，我們先熟悉「雙變數」的互動。這裡有兩個變數：<strong>[序號]</strong> 與 <strong>[累加值]</strong>。<br>
                            請透過下拉選單完成迴圈內的邏輯，<span class="text-white font-bold bg-indigo-800 px-1 rounded border border-indigo-600">答對後才能解鎖執行按鈕！</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl font-mono text-sm text-slate-300 shadow-inner">
                            <div><span class="text-pink-400 font-bold">變數</span> [序號] 設為 <span class="font-bold text-white">0</span></div>
                            <div class="mt-1"><span class="text-pink-400 font-bold">變數</span> [累加值] 設為 <span class="font-bold text-white">0</span></div>
                            <div class="text-orange-400 mt-2 font-bold flex items-center gap-2"><i data-lucide="repeat" class="w-4 h-4"></i> 重複 (5) 次</div>
                            
                            <div class="pl-4 border-l-2 border-orange-500/30 ml-2 mt-1 py-3 bg-slate-800/50 rounded-r-lg flex flex-col gap-3">
                                <div class="flex items-center gap-2 flex-wrap font-bold">
                                    <span class="text-pink-400">變數</span>
                                    <select id="q-blank-1" class="bg-slate-950 border border-slate-600 text-white rounded px-2 py-1 outline-none font-bold text-sm focus:border-indigo-500">
                                        <option value="">(請選擇)</option><option value="序號">序號</option><option value="累加值">累加值</option>
                                    </select>
                                    <select id="q-blank-2" class="bg-slate-950 border border-slate-600 text-white rounded px-2 py-1 outline-none font-bold text-sm focus:border-indigo-500">
                                        <option value="">(請選擇)</option><option value="改變">改變</option><option value="設為">設為</option>
                                    </select>
                                    <span class="font-bold text-white bg-slate-950 px-2 py-1 rounded border border-slate-600">1</span>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap font-bold mt-1">
                                    <span class="text-pink-400">變數</span>
                                    <select id="q-blank-3" class="bg-slate-950 border border-slate-600 text-white rounded px-2 py-1 outline-none font-bold text-sm focus:border-indigo-500">
                                        <option value="">(請選擇)</option><option value="序號">序號</option><option value="累加值">累加值</option>
                                    </select>
                                    <span class="text-slate-300 text-xs">=</span>
                                    <select id="q-blank-4" class="bg-slate-950 border border-slate-600 text-white rounded px-2 py-1 outline-none font-bold text-sm focus:border-indigo-500">
                                        <option value="">(請選擇)</option><option value="序號">序號</option><option value="累加值">累加值</option>
                                    </select>
                                    <span class="text-slate-300 text-xs">+</span>
                                    <select id="q-blank-5" class="bg-slate-950 border border-slate-600 text-white rounded px-2 py-1 outline-none font-bold text-sm focus:border-indigo-500">
                                        <option value="">(請選擇)</option><option value="序號">序號</option><option value="累加值">累加值</option>
                                    </select>
                                </div>
                            </div>
                            <div id="warmup-quiz-feedback" class="text-center"></div>
                        </div>
                        <div class="flex gap-3 mt-auto pt-2">
                            <button id="btn-warm-verify" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2">
                                <i data-lucide="check-square" class="w-5 h-5"></i> 驗證邏輯
                            </button>
                            <button id="btn-warm-next" class="hidden flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95 items-center justify-center gap-2">
                                <i data-lucide="zap" class="w-5 h-5"></i> 執行迴圈 (下一步)
                            </button>
                            <button id="btn-warm-reset" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95" title="重置暖身">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-1/2 bg-slate-900 rounded-xl p-6 border border-indigo-900 shadow-inner z-10 flex flex-col justify-start h-[450px]">
                        <div class="flex justify-between text-xs text-indigo-300 mb-2 font-bold shrink-0">
                            <span>累加迴圈進度</span>
                            <span id="warm-loop-text" class="text-white bg-indigo-900 px-2 py-0.5 rounded">0 / 5 次</span>
                        </div>
                        <div class="w-full h-3 bg-slate-800 rounded-full mb-6 overflow-hidden shadow-inner shrink-0">
                            <div id="warm-loop-bar" class="h-full bg-orange-500 transition-all duration-300 relative" style="width: 0%;">
                                <div class="absolute inset-0 bg-white/20 w-full h-full animate-pulse"></div>
                            </div>
                        </div>
                        
                        <div class="flex gap-4 mb-2 shrink-0">
                            <div class="flex-1 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center shadow-inner">
                                <div class="text-xs text-slate-500 font-bold mb-2">當前 [ 序號 ]</div>
                                <div class="text-4xl font-black text-orange-400 font-mono tracking-wider drop-shadow-md" id="warm-index-text">0</div>
                            </div>
                            <div class="flex-1 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center shadow-inner">
                                <div class="text-xs text-slate-500 font-bold mb-2">當前 [ 累加值 ]</div>
                                <div class="text-4xl font-black text-emerald-400 font-mono tracking-wider drop-shadow-md" id="warm-total-text">0</div>
                            </div>
                        </div>
                        
                        <div class="text-center flex flex-col flex-1 overflow-hidden">
                            <div class="h-6 mt-1 text-sm font-bold text-slate-400 shrink-0" id="warm-math-text">請先完成上方的邏輯配合題</div>
                            <div id="warm-history" class="mt-3 w-full space-y-2 text-left border-t border-slate-800 pt-3 hidden pb-2">
                                <!-- JS 動態插入歷史紀錄 -->
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // ⚡ 能源加總模擬器 (包含陣列邏輯)
        // ==========================================
        let simData = [120, 80, 150, 90, 160];
        let simIndex = 0; 
        let simSum = 0;
        let simFinished = false;
        let simPreviousCase = '';

        function renderSimList() {
            const container = document.getElementById('sim-list-container');
            if (!container) return;
            container.innerHTML = simData.length ? simData.map((val, idx) => {
                const isCurrent = (idx + 1) === simIndex && !simFinished;
                const bgClass = isCurrent 
                    ? 'bg-[#FF661A] text-white shadow-md scale-[1.02] border-[#CC5214] ring-2 ring-orange-300' 
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-750';
                
                return `
                    <div class="flex items-center gap-3 transition-all duration-300 px-2">
                        <div class="text-base font-bold ${isCurrent ? 'text-orange-400' : 'text-slate-400'} w-12 text-center">${idx + 1}</div>
                        <div class="flex-1 border rounded-lg py-2 flex justify-center items-center ${bgClass}">
                            <span class="font-mono text-xl font-bold tracking-wider">${val}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-slate-300 text-sm">清單是空的，沒有可讀取的項目。</p>';
        }

        function updateSimUI() {
            const indexEl = document.getElementById('sim-title-index');
            const sumEl = document.getElementById('sim-sum');
            const itemEl = document.getElementById('sim-list-item');
            const formulaIndexEl = document.getElementById('sim-formula-index');

            if(indexEl) indexEl.innerHTML = simIndex === 0 ? "&nbsp;&nbsp;" : simIndex;
            if(sumEl) sumEl.innerText = simSum;
            if(formulaIndexEl) {
                formulaIndexEl.innerHTML = simIndex === 0 ? "&nbsp;&nbsp;" : simIndex;
            }
            if(itemEl) {
                if (simIndex > 0 && simIndex <= simData.length) {
                    itemEl.innerText = simData[simIndex - 1];
                } else {
                    itemEl.innerText = "-";
                }
            }
            renderSimList();
        }

        function simNextStep() {
            if (simData.length === 0) {
                const mathTextEl = document.getElementById('sim-math-text');
                mathTextEl.textContent = '空清單沒有平均值：清單長度為 0，不能作為除數。';
                mathTextEl.className = 'mt-1 text-sm font-bold text-amber-300 shrink-0';
                return;
            }
            if (simFinished) {
                const average = simSum / simData.length;
                
                const historyEl = document.getElementById('sim-history');
                if (historyEl) {
                    const logItem = document.createElement('div');
                    logItem.className = "bg-cyan-950/50 px-3 py-2 rounded-lg border border-cyan-800 text-cyan-200 text-xs sm:text-sm animate-[popIn_0.3s_ease-out] mt-2";
                    logItem.innerHTML = `<span class="font-bold">⭐ 平均能源計算：</span> <span class="font-mono text-white">${simSum} ÷ ${simData.length} = ${average}</span>`;
                    historyEl.appendChild(logItem);
                }

                const mathTextEl = document.getElementById('sim-math-text');
                if (mathTextEl) {
                    mathTextEl.innerHTML = "🎉 迴圈執行完畢！計算平均值";
                    mathTextEl.className = "h-6 mt-1 text-sm font-bold text-emerald-400 shrink-0";
                }
                
                const btnNext = document.getElementById('sim-btn-next');
                btnNext.disabled = true;
                btnNext.className = 'flex-1 bg-slate-700 text-slate-400 font-bold py-3 px-4 rounded-xl shadow-inner flex items-center justify-center gap-2 cursor-not-allowed opacity-70';
                btnNext.innerHTML = '<i data-lucide="check-circle-2" class="w-5 h-5"></i> 系統分析完成';
                lucide.createIcons();
                return;
            }

            if (simIndex < simData.length) {
                let oldSum = simSum;
                
                simIndex++; 
                triggerValueChangeAnimation('sim-title-index');
                triggerValueChangeAnimation('sim-formula-index');
                
                const currentVal = simData[simIndex - 1];
                simSum += currentVal;
                triggerValueChangeAnimation('sim-sum');
                triggerValueChangeAnimation('sim-list-item');

                const historyEl = document.getElementById('sim-history');
                if (historyEl) {
                    historyEl.classList.remove('hidden');
                    const logItem = document.createElement('div');
                    logItem.className = "bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 text-slate-300 text-xs sm:text-sm animate-[popIn_0.3s_ease-out]";
                    logItem.innerHTML = `<span class="text-indigo-400 font-bold">第 ${simIndex} 次：</span> 編號👉<span class="text-white font-mono">${simIndex}</span>，總能源 <span class="text-emerald-400 font-mono">${oldSum} + ${currentVal} = ${simSum}</span>`;
                    historyEl.appendChild(logItem);
                }

                const mathTextEl = document.getElementById('sim-math-text');
                if (mathTextEl) {
                    mathTextEl.innerHTML = `計算中：<span class="text-white">${oldSum} + ${currentVal} = ${simSum}</span>`;
                }

                updateSimUI();

                if (simIndex >= simData.length) {
                    simFinished = true;
                    const btnNext = document.getElementById('sim-btn-next');
                    btnNext.innerHTML = '<i data-lucide="calculator" class="w-5 h-5"></i> 結束迴圈，計算平均';
                    btnNext.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2";
                    lucide.createIcons();
                }
            }
        }

        function simReset() {
            simIndex = 0; 
            simSum = 0;
            simFinished = false;
            
            const mathTextEl = document.getElementById('sim-math-text');
            if (mathTextEl) {

            if (applyButton) applyButton.addEventListener('click', () => {
                const raw = document.getElementById('sim-data-input').value.trim();
                const parts = raw ? raw.split(/[,，\s]+/) : [];
                const error = document.getElementById('sim-data-error');
                if (parts.length > 8 || parts.some(value => !/^\d+$/.test(value) || Number(value) > 999)) {
                    error.textContent = '請輸入 0～8 筆、每筆 0～999 的整數；以逗號或空格分隔。';
                    return;
                }
                error.textContent = '';
                simData = parts.map(Number);
                document.getElementById('sim-repeat-count').textContent = simData.length;
                simReset();
            });
            document.getElementById('sim-data-new').addEventListener('click', () => {
                let candidate;
                let attempts = 0;
                do {
                    candidate = Array.from({ length: 4 + Math.floor(Math.random() * 4) }, () => 20 + Math.floor(Math.random() * 181));
                } while (candidate.join(',') === simPreviousCase && ++attempts < 12);
                if (candidate.join(',') === simPreviousCase) candidate[0] = candidate[0] === 200 ? 20 : candidate[0] + 1;
                simPreviousCase = candidate.join(',');
                simData = candidate;
                document.getElementById('sim-data-input').value = simData.join(',');
                document.getElementById('sim-data-error').textContent = '';
                document.getElementById('sim-repeat-count').textContent = simData.length;
                simReset();
            });
            document.getElementById('sim-data-demo').addEventListener('click', () => {
                simData = [120, 80, 150, 90, 160];
                document.getElementById('sim-data-input').value = simData.join(',');
                document.getElementById('sim-data-error').textContent = '';
